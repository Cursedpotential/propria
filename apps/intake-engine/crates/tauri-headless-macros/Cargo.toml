# Byline: Claude Code · Opus 5 · 2026-09-17
# Headless replacement for tauri's #[command] / generate_handler! so the donor's
# own command functions are served over the web-mode HTTP contract unchanged.
[package]
name = "tauri-headless-macros"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
