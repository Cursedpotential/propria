name: Knowledge reconciler checks

on:
  pull_request:
    paths:
      - "modules/Probata/probata/workers/knowledge-reconciler/**"
      - "modules/Probata/probata/deploy/docker/n8n/workflows/knowledge-reconciler/**"
      - "modules/Probata/probata/server/api/knowledge_reconcile_routes.py"
      - "modules/Probata/probata/tests/test_knowledge_reconcile_routes.py"
      - "modules/Probata/probata/modules/workbench/api/app/runtime/knowledge_review.py"
      - "modules/Probata/probata/modules/workbench/api/tests/test_knowledge_review.py"
      - ".github/workflows/knowledge-reconciler-checks.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Node - Cloudflare ingress tests
        run: node modules/Probata/probata/workers/knowledge-reconciler/src/index.test.mjs
      - name: Node - whole n8n workflow tests
        run: node modules/Probata/probata/deploy/docker/n8n/workflows/knowledge-reconciler/test-workflow.mjs
      - name: Python syntax check
        run: |
          python -m compileall -q modules/Probata/probata/server/api/knowledge_reconcile_routes.py
          python -m compileall -q modules/Probata/probata/modules/workbench/api/app/runtime/knowledge_review.py
      - name: Install focused Python test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.115" "pydantic>=2" "pydantic-settings>=2" "httpx>=0.27" "sqlalchemy>=2" "pytest>=8" "pytest-asyncio>=0.24"
      - name: Python - Platform contract tests
        env:
          PYTHONPATH: modules/Probata/probata
        run: python -m pytest -q modules/Probata/probata/tests/test_knowledge_reconcile_routes.py
      - name: Python - Workbench owner review tests
        env:
          PYTHONPATH: modules/Probata/probata:modules/Probata/probata/modules/workbench/api
        run: python -m pytest --noconftest -q modules/Probata/probata/modules/workbench/api/tests/test_knowledge_review.py
