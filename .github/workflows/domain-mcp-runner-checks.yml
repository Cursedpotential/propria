name: Domain MCP and human runner
on:
  push:
    branches: [codex/domain-mcp-selector-20261017]
    paths: ['modules/tool-runner/**', '.github/workflows/domain-mcp-runner-checks.yml']
  pull_request:
    paths: ['modules/tool-runner/**', '.github/workflows/domain-mcp-runner-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install bounded test dependencies
        run: |
          python -m pip install -r modules/tool-runner/requirements.txt
          npm install --prefix "$RUNNER_TEMP/propria-ui-test" --ignore-scripts --no-audit --no-fund jsdom@30.1.3
      - name: Verify protocol, authorization and domain separation
        working-directory: modules/tool-runner
        run: python -m unittest test_app.py test_domains.py test_projection.py -q
      - name: Verify human UI and JavaScript syntax
        working-directory: modules/tool-runner
        run: |
          NODE_PATH="$RUNNER_TEMP/propria-ui-test/node_modules" node test_ui.cjs
          node --check static/app.js
          node --check static/connections.js
