<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Massive ETL Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              border: "rgba(255, 255, 255, 0.1)",
              input: "rgba(0, 0, 0, 0.4)",
              ring: "#8b5cf6",
              background: '#09090b', // Zinc 950
              foreground: '#e4e4e7', // Zinc 200
              surface: '#18181b',    // Zinc 900
              primary: {
                DEFAULT: '#8b5cf6',  // Violet 500
                foreground: '#ffffff',
                hover: '#7c3aed',    // Violet 600
                glow: 'rgba(139, 92, 246, 0.5)'
              },
              secondary: {
                DEFAULT: '#ec4899', // Pink 500
                foreground: '#ffffff',
              },
              destructive: {
                DEFAULT: "#7f1d1d",
                foreground: "#fecaca",
              },
              muted: {
                DEFAULT: "#27272a", // Zinc 800
                foreground: "#a1a1aa", // Zinc 400
              },
              accent: {
                DEFAULT: "#27272a",
                foreground: "#fafafa",
              },
              card: {
                DEFAULT: "rgba(24, 24, 27, 0.6)",
                foreground: "#e4e4e7",
              },
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09090b;
        background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, #09090b 50%);
        color: #e4e4e7; /* Zinc 200 */
        min-height: 100vh;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
      
      .glass-panel {
        background: rgba(24, 24, 27, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@0.1.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.309.0?external=react",
    "clsx": "https://esm.sh/clsx@2.1.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.0",
    "react-dropzone": "https://esm.sh/react-dropzone@14.2.3?external=react"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
