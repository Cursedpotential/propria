# Salem Processing Stack v3.1
# Added: Ollama, LiteLLM, FastMCP, Stirling PDF

services:
  # ===========================================
  # REVERSE PROXY
  # ===========================================
  traefik:
    image: traefik:v3.0
    container_name: salem-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.mitechconsult.com`)"
      - "traefik.http.routers.traefik.entrypoints=https"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # ===========================================
  # CACHE/QUEUE (Dragonfly)
  # ===========================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: salem-dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    networks:
      - salem-net
    labels:
      - "traefik.enable=false"

  # ===========================================
  # LLM GATEWAY (LiteLLM)
  # Routes to: OpenRouter, Anthropic, OpenAI, Ollama Cloud, local Ollama
  # ===========================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: salem-litellm
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${SUPABASE_DB_URL}
      # All provider keys - LiteLLM routes based on model name
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    expose:
      - "4000"
    depends_on:
      - ollama
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`llm.mitechconsult.com`)"
      - "traefik.http.routers.litellm.entrypoints=https"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.routers.litellm.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  # ===========================================
  # LOCAL LLM (Ollama) - Can offload to Ollama Cloud
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: salem-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      # For Ollama Cloud offloading (if configured)
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - salem-net
    # GPU passthrough if available (comment out if no GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.mitechconsult.com`)"
      - "traefik.http.routers.ollama.entrypoints=https"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.tls.certresolver=letsencrypt"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"

  # ===========================================
  # MCP GATEWAY (FastMCP)
  # Coordinates MCPs, contains context, runs on VPS not local
  # ===========================================
  fastmcp:
    image: python:3.11-slim
    container_name: salem-fastmcp
    restart: unless-stopped
    working_dir: /app
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8080
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./fastmcp:/app
      - /mnt/r2:/mnt/r2
    command: >
      bash -c "pip install fastmcp uvicorn httpx supabase neo4j qdrant-client boto3 &&
               python -m uvicorn server:app --host 0.0.0.0 --port 8080"
    expose:
      - "8080"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastmcp.rule=Host(`mcp.mitechconsult.com`)"
      - "traefik.http.routers.fastmcp.entrypoints=https"
      - "traefik.http.routers.fastmcp.tls=true"
      - "traefik.http.routers.fastmcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.fastmcp.loadbalancer.server.port=8080"

  # ===========================================
  # ADMIN UI (Directus)
  # ===========================================
  directus:
    image: directus/directus:latest
    container_name: salem-directus
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: ${SUPABASE_HOST}
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USER: ${SUPABASE_USER}
      DB_PASSWORD: ${SUPABASE_PASSWORD}
      DB_SSL: "true"
      STORAGE_LOCATIONS: "r2"
      STORAGE_R2_DRIVER: "s3"
      STORAGE_R2_KEY: ${R2_ACCESS_KEY}
      STORAGE_R2_SECRET: ${R2_SECRET_KEY}
      STORAGE_R2_BUCKET: ${R2_BUCKET}
      STORAGE_R2_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_R2_REGION: auto
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    expose:
      - "8055"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.directus.rule=Host(`admin.mitechconsult.com`)"
      - "traefik.http.routers.directus.entrypoints=https"
      - "traefik.http.routers.directus.tls=true"
      - "traefik.http.routers.directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.directus.loadbalancer.server.port=8055"

  # ===========================================
  # WORKFLOW AUTOMATION (N8N)
  # ===========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: salem-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_HOST}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=${SUPABASE_USER}
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_PASSWORD}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.mitechconsult.com
      - GENERIC_TIMEZONE=America/Detroit
      - TZ=America/Detroit
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - QUEUE_BULL_REDIS_HOST=dragonfly
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
      - /mnt/r2:/mnt/r2
    expose:
      - "5678"
    depends_on:
      - dragonfly
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.mitechconsult.com`)"
      - "traefik.http.routers.n8n.entrypoints=https"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ===========================================
  # DOCUMENT PROCESSING (Unstructured)
  # ===========================================
  unstructured:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: salem-unstructured
    restart: unless-stopped
    volumes:
      - /mnt/r2:/mnt/r2
    expose:
      - "8000"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unstructured.rule=Host(`unstructured.mitechconsult.com`)"
      - "traefik.http.routers.unstructured.entrypoints=https"
      - "traefik.http.routers.unstructured.tls=true"
      - "traefik.http.routers.unstructured.tls.certresolver=letsencrypt"
      - "traefik.http.services.unstructured.loadbalancer.server.port=8000"

  # ===========================================
  # PDF PROCESSING (Stirling PDF)
  # ===========================================
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: salem-stirling
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - LANGS=en_US
    volumes:
      - stirling_data:/usr/share/tessdata
      - stirling_config:/configs
      - /mnt/r2:/mnt/r2
    expose:
      - "8080"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling.rule=Host(`pdf.mitechconsult.com`)"
      - "traefik.http.routers.stirling.entrypoints=https"
      - "traefik.http.routers.stirling.tls=true"
      - "traefik.http.routers.stirling.tls.certresolver=letsencrypt"
      - "traefik.http.services.stirling.loadbalancer.server.port=8080"

  # ===========================================
  # AI MEMORY (Mem0)
  # ===========================================
  mem0:
    image: mem0ai/mem0:latest
    container_name: salem-mem0
    restart: unless-stopped
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - mem0_data:/app/data
    expose:
      - "8000"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mem0.rule=Host(`mem0.mitechconsult.com`)"
      - "traefik.http.routers.mem0.entrypoints=https"
      - "traefik.http.routers.mem0.tls=true"
      - "traefik.http.routers.mem0.tls.certresolver=letsencrypt"
      - "traefik.http.services.mem0.loadbalancer.server.port=8000"

  # ===========================================
  # KNOWLEDGE GRAPH API (Graphiti)
  # ===========================================
  graphiti:
    image: zepai/graphiti:latest
    container_name: salem-graphiti
    restart: unless-stopped
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    expose:
      - "8000"
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphiti.rule=Host(`graphiti.mitechconsult.com`)"
      - "traefik.http.routers.graphiti.entrypoints=https"
      - "traefik.http.routers.graphiti.tls=true"
      - "traefik.http.routers.graphiti.tls.certresolver=letsencrypt"
      - "traefik.http.services.graphiti.loadbalancer.server.port=8000"

  # ===========================================
  # CHAT UI (Open WebUI)
  # ===========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: salem-openwebui
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
    volumes:
      - openwebui_data:/app/backend/data
      - /mnt/r2:/mnt/r2:ro
    expose:
      - "8080"
    depends_on:
      - litellm
      - ollama
    networks:
      - salem-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.mitechconsult.com`)"
      - "traefik.http.routers.openwebui.entrypoints=https"
      - "traefik.http.routers.openwebui.tls=true"
      - "traefik.http.routers.openwebui.tls.certresolver=letsencrypt"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

volumes:
  traefik_certs:
  dragonfly_data:
  ollama_data:
  directus_uploads:
  directus_extensions:
  n8n_data:
  stirling_data:
  stirling_config:
  mem0_data:
  openwebui_data:

networks:
  salem-net:
    name: salem-network

# ===========================================
# SUBDOMAIN MAP
# ===========================================
# traefik.mitechconsult.com   → Traefik Dashboard
# llm.mitechconsult.com       → LiteLLM (unified LLM gateway)
# ollama.mitechconsult.com    → Ollama (local/cloud LLM)
# mcp.mitechconsult.com       → FastMCP (MCP coordinator)
# admin.mitechconsult.com     → Directus (DB admin + file management)
# n8n.mitechconsult.com       → N8N (workflow automation)
# unstructured.mitechconsult.com → Unstructured (doc parsing)
# pdf.mitechconsult.com       → Stirling PDF (PDF tools)
# mem0.mitechconsult.com      → Mem0 (AI memory)
# graphiti.mitechconsult.com  → Graphiti (knowledge graph)
# chat.mitechconsult.com      → Open WebUI (chat interface)
# ===========================================
