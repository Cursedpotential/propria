[package]
name = "family-court-workbench"
version = "0.1.0"
description = "Local desktop work surface for the family-court-toolkit plugin"
edition = "2021"
rust-version = "1.77"

[lib]
name = "family_court_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "family-court-workbench"
path = "src/main.rs"
