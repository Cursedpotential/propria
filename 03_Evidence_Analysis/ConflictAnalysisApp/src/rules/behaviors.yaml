# behaviors.yaml
# Core behavior dictionaries (case-insensitive). Some entries contain abusive language for detection only.

manipulation_gaslighting:
  - "that's not how it happened"
  - "that never happened"
  - "you're being dramatic"
  - "you're imagining things"
  - "you misremember"
  - "i was just kidding"
  - { pattern: "you always", regex: false }
  - { pattern: "you never",  regex: false }

