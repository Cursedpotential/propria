# Existing legal hostname/port, shared by Next and the office editor.
# Request arguments are deliberately omitted: WOPI URLs contain session tokens.
log_format legal_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 3000;
    server_name _;
    client_max_body_size 34m;
    access_log /var/log/nginx/access.log legal_safe;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Administration is not part of the document editing surface.
    location ~ ^/office/(browser/[^/]+/admin|cool/adminws) { return 404; }
    location /office/ {
        set $office_upstream http://legal-office:9980;
        proxy_pass $office_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        set $web_upstream http://legal-web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
    }
}
