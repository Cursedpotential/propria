# Proposed merge fragment; coordinator owns compose.yaml and gateway routes.
# Collabora source contract: https://github.com/CollaboraOnline/online.mirror/blob/main/coolwsd.xml.in
# Microsoft WOPI: https://learn.microsoft.com/en-us/microsoft-365/cloud-storage-partner-program/rest/files/putfile
# Supply an approved immutable image digest; no floating default or new host ports.
services:
  legal-office:
    image: ${LEGAL_OFFICE_IMAGE:?Set pinned Collabora CODE image digest}
    expose:
      - "9980"
    environment:
      aliasgroup1: http://legal-api:8010
      server_name: legal.tilapia-skilift.ts.net
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.service_root=/office
        --o:net.frame_ancestors=https://legal.tilapia-skilift.ts.net
        --o:logging.level=warning
        --o:welcome.enable=false
      # Set independent admin credentials through deployment secrets if admin is enabled.
    cap_add:
      - MKNOD
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9980/office/hosting/discovery"]
      interval: 30s
      timeout: 5s
      retries: 5
  legal-api:
    environment:
      OFFICE_EDITOR_PUBLIC_URL: https://legal.tilapia-skilift.ts.net/office
      OFFICE_EDITOR_INTERNAL_URL: http://legal-office:9980/office
      OFFICE_WOPI_BASE_URL: http://legal-api:8010
      OFFICE_HOST_ORIGIN: https://legal.tilapia-skilift.ts.net
# Gateway must preserve /office/ prefix and upgrade WebSocket connections.
# WOPI callbacks remain internal; redact access_token from request/access logs.
# This file is configuration preparation, not runtime/fidelity acceptance.
