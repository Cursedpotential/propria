# Byline: Grok · grok-4.6 · 2026-08-18
[project]
name = "legal-workspace"
version = "0.1.0"
description = "advocatio (formerly Legal Workspace): legal analysis, strategy, drafting, and filing preparation sibling of Indicia Probata / probata (formerly Agno-MCP-Platform)."
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<0.29",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<0.36",
  "python-docx>=1.1,<2",
  "apscheduler>=3.10,<4",
  "pikepdf>=9,<10",
  "python-multipart>=0.0.20",
  "pypdf>=5,<7",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.3,<3.4",
  "fastmcp>=4,<5",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["api"]

[tool.setuptools.package-data]
legal_workspace = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
