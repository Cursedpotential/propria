# Temporal worker (Python) — dedicated Coolify application.
#
# Polls task queue `evidence-pipeline` and registers (server/temporal/worker.py):
#   workflows:  ChatTranscriptIngest, P0DurabilityProbe, ClassificationBatchPipeline
#   activities: custody / parse / store / knowledge / n8n_webhook, and
#               build_timeline_generation_activity — the projection step the Go
#               extraction_commit_workflow (modules/engine/extraction/flow/workflows.go,
#               DefaultProjectionTaskQueue) schedules on this queue, and the conversation-chunk
#               Activities the Go ProfferWorkflow schedules BEFORE the preview, from the run's normalized generation
#               (modules/engine/proffer/context_chunks.go): chunk_context_threads_activity,
#               publish_context_chunks_activity, publish_call_log_files_activity.
# It also registers the selectable entity/event extractor Activities the Go extraction_request_workflow schedules:
# extract_entities_events_semantica_activity and extract_entities_events_langextract_activity
# (server/temporal/entity_event_activities.py).
# Without this app that queue has no poller and the projection step and the chunk step time out.
#
# What the chunk Activities need (server/context_chunks): the platform Postgres (read), the NIM key
# (CONTEXT_CHUNKS_EMBED_API_KEY_FILE, the same host file the proffer-worker bind-mounts) and Weaviate
# (CONTEXT_CHUNKS_WEAVIATE_URL, the ovh-files tailnet IP; coolify-proxy owns host 8080). The distilbert model is
# baked into the image (deploy/docker/temporal-worker/Dockerfile) and loaded offline.
#
# What build_timeline_generation_activity needs (server/temporal/timeline_activities.py):
# the platform Postgres only (server.timeline.generation.build_generation, one sealed
# generation of timeline.* rows). It does NOT call Timesketch or OpenSearch; the
# Timesketch fork's importer reads the generation later. So no Timesketch env here.
#
# Database credential: server/core/url.py reads PLATFORM_DB_URL. The URL is the same
# host secret the proffer-worker bind-mounts (/data/probata/secrets/platform/database-url,
# mode 0400, owner 10001), so no secret value lives in Coolify env or in git. The
# container runs as 10001 to read it, and the entrypoint rewrites the scheme to
# postgresql+psycopg:// (psycopg 3 is what requirements.txt installs) and strips the
# CR/LF the secret file carries (without that the database name ends in a carriage return).
#
# Build: Coolify base directory modules/Probata/probata, compose location
# /deploy/temporal-worker.yaml, repo Cursedpotential/propria, branch main. The
# Dockerfile is the existing deploy/docker/temporal-worker/Dockerfile.
#
# Coolify watch paths (module prefix, matched against repository-root paths):
#   modules/Probata/probata/server/**
#   modules/Probata/probata/scripts/**
#   modules/Probata/probata/sql/**
#   modules/Probata/probata/requirements.txt
#   modules/Probata/probata/requirements-html-tools.txt
#   modules/Probata/probata/requirements-extractors.txt
#   modules/Probata/probata/deploy/docker/temporal-worker/**
#   modules/Probata/probata/deploy/temporal-worker.yaml
# Auto-deploy is OFF on purpose; deploy explicitly.
#
# Byline: Claude Code · Sonnet · 2026-10-02
# Byline: Claude Code · Sonnet 5.5 · 2026-10-02 (conversation-chunk env and the NIM key mount)
# Byline: Codex · orchestrator · 2026-10-05 (explicit single-case write admission)
# Byline: Codex · GPT-6.1-Sol · 2026-10-06 (independent AI content Activities and retained outputs)

services:
  temporal-worker:
    build:
      context: .
      dockerfile: deploy/docker/temporal-worker/Dockerfile
    image: ${TEMPORAL_WORKER_IMAGE:-platform-temporal-worker:latest}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - probata
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal-server:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: evidence-pipeline
      TEMPORAL_ACTIVITY_THREADS: ${TEMPORAL_ACTIVITY_THREADS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Match the engine's approved case. Background writes require explicit
      # Live mode and this pair; absent historical mode cannot authorize them.
      PROFFER_MATTER_ID: ${PROFFER_MATTER_ID:-}
      PROFFER_COURT_CASE_ID: ${PROFFER_COURT_CASE_ID:-}
      PROFFER_STARTER_URL: ${PROFFER_STARTER_URL:-http://100.91.190.107:8091}
      PROFFER_SERVICE_TOKEN_FILE: /run/secrets/proffer-service-token
      # Conversation chunks (owner 2026-10-02). The collection is owner-approved ProfferChunks20261002 and is the
      # code default; the worker creates it when absent (additive schema only afterwards).
      CONTEXT_CHUNKS_WEAVIATE_URL: ${CONTEXT_CHUNKS_WEAVIATE_URL:-http://100.91.190.107:8082}
      CONTEXT_CHUNKS_COLLECTION: ProfferChunks20261002
      # A chunk the Super Index (CocoIndex) already cut and embedded is copied with its vectors when its content key
      # matches (server/context_chunks/ids.chunk_content_key). Absent collection = no reuse.
      CONTEXT_CHUNKS_REUSE_COLLECTION: CaseBibleChunks20261002
      CONTEXT_CHUNKS_EMBED_API_KEY_FILE: /run/secrets/nvidia-api-key
      # The LangExtract entity/event extractor uses the default extractor's model settings (kimi-k3 on NVIDIA NIM,
      # json_object replies, max tokens >= 1500); the same NIM key file the chunk Activities read.
      # Byline: Claude Code · Sonnet 5.5 · 2026-10-02
      ENTITY_MODEL_API_KEY_FILE: /run/secrets/nvidia-api-key
      # Existing AI search collection; Activities validate schema without creating it.
      CONTEXT_SEARCH_AI_CHAT_COLLECTION: ${CONTEXT_SEARCH_AI_CHAT_COLLECTION:-AiChatEvents20260918}
      CONTEXT_SEARCH_VECTOR_NAME: text_nim
      AI_CONTENT_ROOT: /data/proffer/derive-scratch/ai-content
    command:
      - sh
      - -c
      - 'PLATFORM_DB_URL="$$(tr -d "\r\n" < /run/secrets/platform-database-url | sed "s#^postgresql://#postgresql+psycopg://#")" exec python -m server.temporal.worker'
    volumes:
      # Pre-create only this dedicated retained directory owned by 10001:10001.
      - type: bind
        source: /data/probata/volumes/proffer/derive-scratch/ai-content
        target: /data/proffer/derive-scratch/ai-content
        bind:
          create_host_path: false
      - /data/probata/secrets/platform/database-url:/run/secrets/platform-database-url:ro
      - /data/probata/secrets/intake-engine/nvidia-api-key:/run/secrets/nvidia-api-key:ro
      - type: bind
        source: /data/probata/secrets/proffer/service-token
        target: /run/secrets/proffer-service-token
        read_only: true
        bind:
          create_host_path: false

networks:
  probata:
    external: true
