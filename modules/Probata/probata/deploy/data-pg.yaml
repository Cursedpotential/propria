# =============================================================================
# POSTGRESQL SERVICE — source in the Propria monorepo.
# Coolify source routing: Cursedpotential/propria, base directory
# /modules/Probata/probata, compose path /deploy/data-pg.yaml. The root AGENTS.md
# records current host routing; the selected Coolify app supplies BIND_IP and
# DB_USER / DB_PASS / DB_DATABASE. This file is configuration, not a health check.
#
# Historical split, 2026-07-05: PostgreSQL became its own Coolify application so
# a change to one database would not restart the other data services. The old
# repository/host routes and the completed split checklist remain in Git history.
#
# Persistent data uses the absolute pgdata bind below. Initialization SQL runs
# only for an empty data directory. The root's 2026-10-05 single-case contract
# governs current data operations; the historical cutover is not a reset recipe.
#
# Routing-comment amendment: ChatGPT · GPT-6 Astra · 2026-10-17; root import
# contract (2026-09-26) and operating-mode contract (2026-10-05), read at 68f369e.
# No service configuration or executable instructions changed.
# =============================================================================

services:
  probata-db:
    # Custom PG18: pg_duckdb + PostGIS + pgvector + pg_stat_statements.
    build:
      context: ./deploy/docker/postgres   # Coolify resolves build contexts from the repo root (base_directory), not the compose file
    image: probata-postgres:18-duckdb
    container_name: probata-db
    restart: unless-stopped
    ports:
      # raw TCP at the selected service's bind address; tailnet routing is in the root contract
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - /data/probata/volumes/pgdata:/var/lib/postgresql
      # init SQL — ABSOLUTE host binds (gotcha #5); run once on an EMPTY data dir
      # THE database: fresh volumes bootstrap from the snapshot (migrations retired 2026-09-07, D-153); file lives on the host
      - /data/probata/config/sql/schema_snapshot_20260907.sql:/docker-entrypoint-initdb.d/01_schema_snapshot.sql:ro
      # Retained originals, READ-ONLY, at the proffer worker's own path, so the file://
      # object_uri recorded for every retained source resolves here unchanged and
      # DuckDB structured ELT reads the exact hash-verified bytes (owner decision
      # 2026-10-16). Claude Code · Opus 5.5 · 2026-10-16
      - /data/probata/volumes/proffer/source-objects:/data/proffer/source-objects:ro
    # The retained objects are 10001:10001, mode 0440/0750 (the proffer worker's
    # uid). Group membership lets postgres read them without changing any custody
    # file's owner or mode.
    group_add:
      - "10001"
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-platform}
    healthcheck:
      # -d postgres: without -d, pg_isready targets a database named after the user, and
      # DB_DATABASE is "ai" in Coolify too. Database "ai" does not exist, so every check
      # (every 5 s) logged a FATAL line (2026-09-20, 2026-10-02). The maintenance database
      # always exists. Claude Code · Opus 5.5 · 2026-10-02
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pg
      - probata                # shared external network; the service name is `probata-db`

networks:
  pg:
  probata:
    external: true          # provisioned outside this compose definition on the selected host

# No named volumes — absolute host binds (declared inline above).
# Byline: Claude Code · Fable 5 · 2026-07-05
