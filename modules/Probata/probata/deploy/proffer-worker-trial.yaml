# Trial adaptation; unavailable Toolkit/catalog siblings explicitly unconfigured.
services:
  proffer-worker:
    build:
      context: ../../..
      dockerfile: modules/Probata/probata/deploy/docker/proffer-worker/Dockerfile
    image: ${PROFFER_WORKER_IMAGE:-platform-proffer-worker:latest}
    restart: unless-stopped
    networks:
    - probata
    - coolify
    environment:
      PLATFORM_DATABASE_URL_FILE: /run/secrets/platform-database-url
      TEMPORAL_HOST_PORT: 100.108.135.88:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-proffer-v1}
      N8N_PROFFER_BASE_URL: ${N8N_PROFFER_BASE_URL:?set}
      N8N_PROFFER_AUTH_HEADER: ${N8N_PROFFER_AUTH_HEADER:?set}
      N8N_PROFFER_AUTH_VALUE_FILE: /run/secrets/n8n-proffer-auth
      N8N_FLOW_BINDINGS_FILE: ${N8N_FLOW_BINDINGS_FILE:-}
      SELECT_PARSER_HTTP_TIMEOUT: ${SELECT_PARSER_HTTP_TIMEOUT:-35s}
      EXECUTE_PARSER_HTTP_TIMEOUT: ${EXECUTE_PARSER_HTTP_TIMEOUT:-31m}
      SOURCE_OBJECT_DIR: /data/proffer/source-objects
      PARSER_BUNDLE_DIR: /data/proffer/parser-bundles
      NORMALIZED_BUNDLE_DIR: /data/proffer/normalized-bundles
      INVENTORY_MANIFEST_DIR: /data/proffer/inventory-manifests
      DERIVE_SCRATCH_DIR: /data/proffer/derive-scratch
      ANALYSIS_GRAPH_ROOT: /data/proffer/derive-scratch/ai-content/analysis-graphs
      ANALYSIS_GRAPH_MATTER_ID: ${ANALYSIS_GRAPH_MATTER_ID:?set}
      ANALYSIS_GRAPH_CASE_ID: ${ANALYSIS_GRAPH_CASE_ID:?set}
      ANALYSIS_GRAPH_ACCESS_POLICY_ID: ${ANALYSIS_GRAPH_ACCESS_POLICY_ID:?set}
      ANALYSIS_GRAPH_CREATED_BY_SERVICE: ${ANALYSIS_GRAPH_CREATED_BY_SERVICE:?set}
      ANALYSIS_SURREAL_URL: http://100.108.135.88:8471
      ANALYSIS_SURREAL_NAMESPACE: fct
      ANALYSIS_SURREAL_DATABASE: analysis
      ANALYSIS_SURREAL_AUTH_LEVEL: database
      ANALYSIS_SURREAL_USER_FILE: /run/secrets/analysis-surreal-user
      ANALYSIS_SURREAL_PASSWORD_FILE: /run/secrets/analysis-surreal-password
      TOOLKIT_INVENTORY_ROOT: ${TOOLKIT_INVENTORY_ROOT:-}
      DERIVED_ROOTS_JSON: ''
      PLATFORM_TOOLS_BASE_URL: ${PLATFORM_TOOLS_BASE_URL:?set}
      OBJECT_STORES_JSON: '{"b2":"/run/secrets/casebible-b2.json"}'
      SOURCE_ROOTS_JSON: '[{"id":"b2-vault","label":"B2 / Case Bible","url":"b2://salem-data/consignatio/casevault/"},{"id":"b2-bucket","label":"B2
        / salem-data (whole bucket)","url":"b2://salem-data/"}]'
      ENTITY_MODEL_API_KEY_FILE: /run/secrets/nvidia-api-key
      SURREAL_CASE_URL: http://100.108.135.88:8471
      SURREAL_CASE_NAMESPACE: ${SURREAL_CASE_NAMESPACE:-fct}
      SURREAL_CASE_DATABASE: ${SURREAL_CASE_DATABASE:-case}
      SURREAL_CASE_AUTH_LEVEL: database
      SURREAL_CASE_USER_FILE: /run/secrets/surreal-case-user
      SURREAL_CASE_PASSWORD_FILE: /run/secrets/surreal-case-password
      CONTEXT_SEARCH_WEAVIATE_URL: http://100.108.135.88:8082
      CONTEXT_SEARCH_MESSAGE_COLLECTION: ProfferMsgEvents20261002
      CONTEXT_SEARCH_AI_CHAT_COLLECTION: AiChatEvents20260918
      CONTEXT_SEARCH_DOCUMENT_COLLECTION: DocEvents20261001
      CONTEXT_SEARCH_CREATABLE_COLLECTIONS: DocEvents20261001
      CONTEXT_SEARCH_VECTOR_NAME: text_nim
      CONTEXT_SEARCH_EMBED_API_KEY_FILE: /run/secrets/nvidia-api-key
      GOMAXPROCS: '1'
      GOMEMLIMIT: 384MiB
      APPROVED_CONTEXT_GRAPH_ENABLED: 'true'
      PROFFER_MAX_CONCURRENT_ACTIVITIES: '1'
    volumes:
    - type: bind
      source: /data/probata/secrets/analysis-graph/analysis-surreal-user
      target: /run/secrets/analysis-surreal-user
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/analysis-graph/analysis-surreal-password
      target: /run/secrets/analysis-surreal-password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/volumes/proffer/source-objects
      target: /data/proffer/source-objects
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/volumes/proffer/parser-bundles
      target: /data/proffer/parser-bundles
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/volumes/proffer/normalized-bundles
      target: /data/proffer/normalized-bundles
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/volumes/proffer/inventory-manifests
      target: /data/proffer/inventory-manifests
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/volumes/proffer/derive-scratch
      target: /data/proffer/derive-scratch
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/casebible-b2.json
      target: /run/secrets/casebible-b2.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/n8n/proffer-auth
      target: /run/secrets/n8n-proffer-auth
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/platform/database-url
      target: /run/secrets/platform-database-url
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/intake-engine/nvidia-api-key
      target: /run/secrets/nvidia-api-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/surreal-case/user
      target: /run/secrets/surreal-case-user
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/surreal-case/password
      target: /run/secrets/surreal-case-password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/probata/secrets/tool-gateway/service-token
      target: /run/secrets/tool-gateway-service-token
      read_only: true
      bind:
        create_host_path: false
    mem_limit: 512m
    cpus: 1
networks:
  probata:
    external: true
  coolify:
    external: true
