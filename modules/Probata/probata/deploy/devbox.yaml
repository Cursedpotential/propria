# =============================================================================
# DEVBOX — Kasm Workspaces desktop sandbox for agents, deployed as its OWN Coolify
# "Docker Compose" app on ovh-files (server cn89l8801u8gsginw1rxq5qt, tailnet
# 100.91.190.107) — owner orders 2026-09-07 16:18-16:21 ("spin up a sandbox on the VPS …
# I'll move you there", "not agno", "custom environment", "add kasm").
#
# Byline: Claude Code · Sonnet 5 · 2026-09-08 (persistent single-user desktop: whole-home
# mapped volume, run as root, apt installs survive restarts/reboots — owner decisions
# 2026-09-08 11:41-11:44; redeploys are accepted as reinstalls of anything not under
# /home/kasm-user).
# Byline: Claude Code · Sonnet 5 · 2026-09-08 (devbox v2 full-toolchain build: second mapped
# volume for /home/linuxbrew so Homebrew survives redeploys, glances web port, DEVBOX_CPUS/MEM
# defaults bumped to 4/8g — plan "rosy-wibbling-cosmos", owner APPROVED 12:10 EDT).
# Byline: Claude Code · Sonnet 5 · 2026-09-08 (tailscale serve config bind fixed to an absolute
# host path after two failed relative/content: attempts under Coolify — see the dated comment
# on the tailscale service's volumes: block for the full history).
#
# Byline: Claude Code · Opus 5.5 · 2026-09-28 (DF-30: the devbox's own Authentik machine identity,
# service account `devbox`, mounted read-only from the host; owner option A 2026-09-28 04:22).
# Byline: Claude Code · Opus 5.5 · 2026-10-02 (P-1 step 1 of the Kasm Workspaces brief, 2026-09-27-TODO.md #1:
# xrdp off host port 3389 -> 13389, ttyd web terminal :7681 (P-3), Tailscale sidecar removed, reserved slot for
# the Claude Code listener the legal desk will call).
#
# Access: https://100.91.190.107:6901 from the tailnet only (BIND_IP), self-signed cert,
# user `kasm_user`, password = VNC_PW (Coolify env, never in this file).
# Coolify Watch Paths for this app: DISABLED ON PURPOSE — deploy manually via the API.
# Coolify env to set: BIND_IP=100.91.190.107, VNC_PW=<strong>, (optional) DEVBOX_CPUS, DEVBOX_MEM.
# HOST-PREP for the machine identity (DF-30), BEFORE deploying this revision — a missing host file
# would be created by Docker as an empty directory:
#   install -d -m 0700 /data/probata/secrets/devbox
#   install -m 0440 -o root -g 1000 <values> /data/probata/secrets/devbox/authentik-machine.env
# KEY=value lines: AUTHENTIK_TOKEN_URL, AUTHENTIK_CLIENT_ID, AUTHENTIK_USERNAME, AUTHENTIK_APP_PASSWORD.
# The desktop copy with its provenance header is ~/.secrets/devbox-authentik.env. Never in git.
# HOST-PREP (once, before first deploy of this revision): seed BOTH mapped volumes —
# /data/probata/volumes/devbox/home from the base image's /home/kasm-user, AND
# /data/probata/volumes/devbox/linuxbrew from the built image's /home/linuxbrew (Homebrew is
# installed at build time as kasm-user; seed the volume from the built image AFTER the first
# deploy, see TOOLING-REPAIRS.md 2026-09-08 entry for the exact seed commands), then
# chown -R 1000:1000 /data/probata/volumes/devbox/home /data/probata/volumes/devbox/linuxbrew
#                   docker network inspect probata >/dev/null 2>&1 || docker network create probata
# Joins the shared `probata` network so the sandbox reaches pg/milvus/n8n by service name.
# Resource caps keep the sandbox from starving n8n/PG on the same host.
# =============================================================================

services:
  devbox:
    build:
      context: .
      dockerfile: deploy/docker/devbox/Dockerfile
    image: ${DEVBOX_IMAGE:-probata-devbox:latest}
    container_name: devbox
    restart: unless-stopped
    user: root                          # Kasm-documented root override (docs.kasm.com "running-as-root"); sandbox is the security boundary
    shm_size: "1g"                      # KasmVNC needs a large /dev/shm
    # FUSE for the rclone mount of OpenList's WebDAV at ~/files (owner 2026-09-08: virtual file shares inside the box)
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    cpus: ${DEVBOX_CPUS:-4}
    mem_limit: ${DEVBOX_MEM:-8g}
    ports:
      - "${BIND_IP:-127.0.0.1}:6901:6901"   # KasmVNC HTTPS — tailnet-only (primary access)
      # xrdp moved off host port 3389 (2026-10-02, P-1 step 1): Kasm Workspaces' installer needs 3389 for its
      # own RDP gateway and aborted its pre-flight on 2026-09-08 because this publish held it. 13389 keeps
      # mstsc backup access and is the target of Kasm's Guacamole connection to the devbox.
      - "${BIND_IP:-127.0.0.1}:13389:3389"  # xrdp — backup access via mstsc (owner 16:23), Kasm Guacamole target
      - "${BIND_IP:-127.0.0.1}:7681:7681"   # ttyd web terminal landing in `claude` (P-3) — tailnet-only
      - "${BIND_IP:-127.0.0.1}:8384:8384"   # Syncthing UI — desktop<->devbox file link (owner 16:22)
      - "${BIND_IP:-127.0.0.1}:22000:22000" # Syncthing sync
      - "${BIND_IP:-127.0.0.1}:61208:61208" # glances web dashboard (owner 11:52 "dashboard monitor")
    environment:
      VNC_PW: ${VNC_PW:?set VNC_PW in Coolify env}
      OPENLIST_URL: ${OPENLIST_URL:-http://openlist:5244}      # service DNS on the probata network
      OPENLIST_USER: ${OPENLIST_USER:-admin}
      OPENLIST_PASS: ${OPENLIST_PASS:-}                        # set in Coolify env; empty = no mount
      KASM_SVC_AUDIO: "0"
      KASM_SVC_UPLOADS: "1"
      KASM_SVC_DOWNLOADS: "1"
      TZ: America/Detroit
      # Authentik service-account credentials for machine clients (DF-30); the file, not env,
      # holds the app password. deploy/workbench-audit/audit.mjs reads it.
      AUTHENTIK_MACHINE_CREDENTIALS_FILE: /run/secrets/devbox-authentik.env
      # START_PULSEAUDIO: "0"   # uncomment + redeploy ONLY if the root session loops on "Creating secure
                                 # connection" (Kasm docs: fix for root sessions that fail to start)
    volumes:
      # WHOLE HOME is the mapped volume (owner decision 2026-09-08 11:41-11:44): persistent single-user
      # desktop, not a persist-and-symlink subset. Seeded once from the image on the host BEFORE first
      # boot of this revision (see devbox.yaml header + TOOLING-REPAIRS.md), so /home/kasm-user/.claude,
      # .agents, .ssh, .config, .memsearch, .opencode, work, .local all land directly in the volume.
      - /data/probata/volumes/devbox/home:/home/kasm-user
      # Homebrew lives under a SEPARATE mapped volume (Homebrew refuses to run as root; it's installed at
      # build time as kasm-user into /home/linuxbrew/.linuxbrew — owner addition 11:54-12:02). Seeded once
      # from the built image the same way as /home/kasm-user (see TOOLING-REPAIRS.md), so brew packages
      # survive redeploys too.
      - /data/probata/volumes/devbox/linuxbrew:/home/linuxbrew
      # root's home on the host too (2026-10-02, owner "address the loss of the agents' work so that doesn't
      # happen again"): the container runs as root, so a `docker exec` without -u lands in /root, and anything a
      # tool writes there (a Claude/npm/uv config, a work folder) would otherwise die with the container. Seeded
      # once from the image's /root before the first deploy of this revision. Agents still work as kasm-user in
      # ~/work (docs/reference/DEVBOX-ON-OVH-FILES.md, "Where work lives"); /tmp stays scratch, and
      # deploy/devbox/pre_redeploy_check.py rescues whatever is left in the container layer before a redeploy.
      - /data/probata/volumes/devbox/root:/root
      # the owner's desktop `the-platform-workspace` over SMB (host automount /mnt/desktop-share, tailnet, encrypted;
      # owner 2026-09-08 10:44-10:55). Read-write. Empty when the desktop is off — nothing here may depend on it at boot.
      - /mnt/desktop-share:/home/kasm-user/desktop:rslave
      # The devbox's Authentik machine identity (DF-30). Absolute host path; see HOST-PREP above.
      - /data/probata/secrets/devbox/authentik-machine.env:/run/secrets/devbox-authentik.env:ro
      # kasm-user's xrdp password (XRDP_PASSWORD=...), for Kasm's Guacamole RDP workspace (2026-10-02). HOST-PREP: the file
      # must exist before a deploy (install -m 0440 -o root -g 1000), or Docker creates an empty directory in its place.
      - /data/probata/secrets/devbox/xrdp.env:/run/secrets/devbox-xrdp.env:ro
    networks:
      - probata

  # The Tailscale sidecar `kasm` (node kasm.tilapia-skilift.ts.net, 100.87.31.37) was REMOVED 2026-10-02 (P-1 step 1;
  # owner ruling 2026-09-08 17:40: no Tailscale sidecars, a Tailscale Service for every name). The devbox desktop is
  # reached through svc:devbox (deploy/tailscale/devbox-serve.hujson, served by ovh-files' own tailscaled), and the
  # name `kasm` goes to svc:kasm for Kasm Workspaces (deploy/kasm/). Its state dir /data/probata/tsnet/kasm stays on
  # the host untouched; the stale tailnet device is removed by the owner. Claude Code · Opus 5.5 · 2026-10-02.

  # RESERVED, NOT BUILT (owner 2026-10-02 01:14-01:17): the legal work desk's "consult/escalate to Claude" backend.
  # It will be a second service here, `devbox-claude`, built from the SAME probata-devbox image and mounting the SAME
  # /data/probata/volumes/devbox/home at /home/kasm-user, running as uid 1000 with no desktop: a small listener that
  # runs the unmodified `claude -p` with the owner's own signed-in subscription (credentials stay in ~/.claude on this
  # volume; the desk never sees them). Tailnet-only: published on ${BIND_IP} and named by a Tailscale Service
  # (reserved name svc:devbox-claude), never public, never behind Authentik. It lives in this Coolify app, not in a Kasm
  # session, because Kasm sessions start and stop on demand and the listener must always be up. Another lane builds it.

networks:
  probata:
    external: true
