# =============================================================================
# LIBRECHAT — its OWN Coolify app `librechat` on ovh-files (tailnet
# 100.91.190.107), Coolify project "Propria" / production, beside the app
# `librechat-mongo` (deploy/librechat-mongo.yaml). Minimal profile: app + mongo
# ONLY — NO Meilisearch (SEARCH=false), NO rag_api/vector store (knowledge lives
# in the platform spine → Weaviate, ADR-0040); a second RAG lane would violate
# single-writer.
#
# Model backend = Portkey gateway (ovh-app :8787) via the chat.json failover
# lane, sent per-request as the x-portkey-config header (see
# docker/gateway/portkey/README.md). The header value is the MATERIALIZED
# config (secrets substituted, `_comment` dropped, one line) held in the
# PORTKEY_CHAT_CONFIG Coolify env — LibreChat interpolates ${PORTKEY_CHAT_CONFIG}
# from container env into the header at request time (config file itself stays
# secret-free).
#
# MCP tools come straight from ContextForge virtual servers (tracked list in
# docker/librechat/librechat.yaml), authenticated with CONTEXTFORGE_MCP_TOKEN.
# That tracked, secret-free config is baked into the derived image, so a
# Git-backed Coolify deploy cannot keep running a stale host-staged copy.
#
# Names: tailnet https://librechat.tilapia-skilift.ts.net (Tailscale Service
# svc:librechat, deploy/tailscale/librechat-serve.hujson); public
# https://librechat.int.mitechconsult.com behind Authentik (Traefik router
# `librechat-public` in ovh-app's propria-public-portal.yaml).
#
# HOST-PREP (once, before first deploy):
#   mkdir -p /data/probata/volumes/librechat/{images,uploads,logs}
#   chown 1000:1000 /data/probata/volumes/librechat/{images,uploads,logs}   # image runs as `node` (1000)
#   docker network inspect probata >/dev/null 2>&1 || docker network create probata
#
# Coolify gotcha: env values are baked at deploy — set ALL envs before first
# deploy; changes need a redeploy. After the owner registers their account,
# flip ALLOW_REGISTRATION=false + redeploy.
# =============================================================================
# Byline: Claude Code · Fable 5 · 2026-07-20
# Byline: Claude Code · Opus 5 · 2026-08-05 (digest pin + stale-comment corrections)
# Byline: Codex · GPT-5.6-Sol · 2026-08-29 (tracked ContextForge/Portkey MCP config)
# Byline: Claude Code · Fable 5.1 · 2026-09-26 (recreated as Coolify apps; MCP via ContextForge; fail-closed env; healthcheck)

services:
  librechat:
    # The base image is pinned by DIGEST in docker/librechat/Dockerfile, not
    # `:latest` — this is production, and a redeploy on a floating tag silently
    # swaps the version. That digest reports v0.8.7 (config schema 1.3.13).
    build:
      context: .
      dockerfile: docker/librechat/Dockerfile
    image: platform-librechat:latest
    container_name: librechat
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:3080:3080"   # tailnet-only; NEVER 0.0.0.0
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      # --- session/crypto secrets (random, stored in Coolify env only) ---
      JWT_SECRET: ${JWT_SECRET:?set a random JWT secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a random JWT refresh secret}
      CREDS_KEY: ${CREDS_KEY:?set a random 32-byte hex CREDS_KEY}
      CREDS_IV: ${CREDS_IV:?set a random 16-byte hex CREDS_IV}
      # --- Portkey chat lane (materialized chat.json, single line) ---
      PORTKEY_CHAT_CONFIG: ${PORTKEY_CHAT_CONFIG:?set the materialized Portkey chat lane}
      # --- ContextForge MCP client token (Bearer for the virtual servers) ---
      CONTEXTFORGE_MCP_TOKEN: ${CONTEXTFORGE_MCP_TOKEN:?set the ContextForge MCP client token}
      # --- minimal profile ---
      SEARCH: "false"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_SOCIAL_LOGIN: "false"
      NO_INDEX: "true"
    healthcheck:
      # busybox wget ships in the alpine-based image; /health answers 200 "OK".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      # Bind mounts only — owner backs up host dirs (no named volumes).
      - /data/probata/volumes/librechat/images:/app/client/public/images
      - /data/probata/volumes/librechat/uploads:/app/uploads
      - /data/probata/volumes/librechat/logs:/app/api/logs
    networks:
      - librechat
      - probata

networks:
  librechat:
  probata:
    external: true
