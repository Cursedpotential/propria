# Byline: Claude Code · Opus 5.5 · 2026-09-26 — tailnet portal, https://homepage.tilapia-skilift.ts.net
# (tailscale serve: / -> this container on 100.72.169.40:3010, /progress -> the progress board :3020).
# On the tailnet nothing sits behind Authentik; every link here is a *.tilapia-skilift.ts.net name.
#
# Rules carried over from the hand-made instance (/data/dashboards/homepage, retired 2026-09-26):
# - A site monitor is a reachability check run by this container, not proof a feature works.
# - A preview that does not run has no href. Credentials never go in this file.
# - Widgets are native Homepage customapi widgets, never an iframe (owner 2026-09-14). Their `url:`
#   is fetched server-side by this container, straight from the progress board on the host's
#   tailnet address; only the browser-facing `href:` links use the public names.
#
# Section order and contents: owner 2026-09-26 23:20 EDT (Workspaces: Case Bible, Probata, Family
# Law Toolkit, Legal Work Desk; a File management section with FileFlows, Filestash and OpenList;
# service and storage health under Operations). Development: owner decisions relayed 23:35 EDT.
# Layout (left third widgets, right two thirds buttons): shared/settings.yaml + shared/custom.css.

# ------------------------------------------------------------------ left column: the live board
- Live board:
    - Live surfaces:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Up, degraded and down across the previewed surfaces
        icon: mdi-lan-connect
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          mappings:
            - field: up
              label: Up
              format: number
            - field: degraded
              label: Degraded
              format: number
            - field: down
              label: Down
              format: number
            - field: total
              label: Total
              format: number
    - Health probes:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Endpoint probe outcomes and latency percentiles
        icon: mdi-heart-pulse
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          mappings:
            - field: ok
              label: OK
              format: number
            - field: warn
              label: Warn
              format: number
            - field: fail
              label: Fail
              format: number
            - field: p50_ms
              label: p50
              format: text
              suffix: " ms"
            - field: p95_ms
              label: p95
              format: text
              suffix: " ms"
    - Latency trend:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: p50 and p95 probe latency, sampled every 30 seconds
        icon: mdi-chart-line
    - Surfaces needing attention:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Degraded or down surfaces from the live health probe
        icon: mdi-alert-octagon-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: down_list
            name: name
            label: summary
            limit: 8
    - Slowest endpoints:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: The five slowest probes in the latest poll
        icon: mdi-speedometer-slow
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: slowest
            name: service
            label: summary
            limit: 5
    - Open to-dos:
        description: Open URGENT-TODO.md items, newest first (synced copy)
        icon: mdi-checkbox-marked-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/todo-feed
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: items
            name: area
            label: summary
            limit: 8
    - Pipeline lanes:
        href: https://homepage.tilapia-skilift.ts.net/progress/
        description: Observation counts per lane, live from Surreal
        icon: mdi-view-list-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/lane-rollups
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: lanes
            name: lane
            label: summary
            limit: 8
    - Lane timeline:
        href: https://homepage.tilapia-skilift.ts.net/progress/
        description: Observations by lane, observed to updated
        icon: mdi-chart-gantt

