# Byline: Claude Code · Opus 5.5 · 2026-09-26 — public portal, https://homepage.int.mitechconsult.com
# (Traefik file route homepage-public -> this container on 100.72.169.40:3012, behind the one
# Authentik login; /progress on the same host goes to the progress board through the same gate).
#
# Access rule (owner 2026-09-23): off the tailnet every human surface is behind the one Authentik
# login, and this portal lists user surfaces only. Infrastructure and admin consoles (Coolify,
# Temporal, n8n, ContextForge, Portkey, Infisical, the portal editor) are tailnet-only and have no
# tile here. Every href below is a *.int.mitechconsult.com route that exists in Traefik's
# propria-public-portal.yaml; a database UI without a public route (pgAdmin, DbGate, CloudBeaver,
# Surrealist, Weaviate UI) and FileFlows are listed only on the tailnet portal.
# Widget `url:`s and site monitors are fetched server-side by this container over the host's
# tailnet address; they never pass Authentik and are not links.
# Section order and contents mirror the tailnet portal (owner 2026-09-26 23:20 EDT).

# ------------------------------------------------------------------ left column: the live board
- Live board:
    - Live surfaces:
        href: https://progress.int.mitechconsult.com/health/
        description: Up, degraded and down across the previewed surfaces
        icon: mdi-lan-connect
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          mappings:
            - field: up
              label: Up
              format: number
            - field: degraded
              label: Degraded
              format: number
            - field: down
              label: Down
              format: number
            - field: total
              label: Total
              format: number
    - Health probes:
        href: https://progress.int.mitechconsult.com/health/
        description: Endpoint probe outcomes and latency percentiles
        icon: mdi-heart-pulse
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          mappings:
            - field: ok
              label: OK
              format: number
            - field: warn
              label: Warn
              format: number
            - field: fail
              label: Fail
              format: number
            - field: p50_ms
              label: p50
              format: text
              suffix: " ms"
            - field: p95_ms
              label: p95
              format: text
              suffix: " ms"
    - Latency trend:
        href: https://progress.int.mitechconsult.com/health/
        description: p50 and p95 probe latency, sampled every 30 seconds
        icon: mdi-chart-line
    - Surfaces needing attention:
        href: https://progress.int.mitechconsult.com/health/
        description: Degraded or down surfaces from the live health probe
        icon: mdi-alert-octagon-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: down_list
            name: name
            label: summary
            limit: 8
    - Slowest endpoints:
        href: https://progress.int.mitechconsult.com/health/
        description: The five slowest probes in the latest poll
        icon: mdi-speedometer-slow
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: slowest
            name: service
            label: summary
            limit: 5
    - Open to-dos:
        description: Open URGENT-TODO.md items, newest first (synced copy)
        icon: mdi-checkbox-marked-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/todo-feed
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: items
            name: area
            label: summary
            limit: 8
    - Pipeline lanes:
        href: https://progress.int.mitechconsult.com/
        description: Observation counts per lane, live from Surreal
        icon: mdi-view-list-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/lane-rollups
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: lanes
            name: lane
            label: summary
            limit: 8
    - Lane timeline:
        href: https://progress.int.mitechconsult.com/
        description: Observations by lane, observed to updated
        icon: mdi-chart-gantt

