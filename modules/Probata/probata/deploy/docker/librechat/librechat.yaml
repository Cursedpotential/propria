# LibreChat instance config — SOURCE OF TRUTH lives here in the repo and is
# baked read-only into the derived image at /app/librechat.yaml. SECRET-FREE:
# runtime values are interpolated by LibreChat from container configuration.
# Byline: Claude Code · Fable 5 · 2026-07-20
# Byline: Codex · GPT-5.6-Sol · 2026-08-29 (tracked image-baked config)
# Byline: Claude Code · Opus 5.5 · 2026-09-25 (chain comment: glm-5.1 removed, kimi-k3 on NVIDIA NIM primary)
# Byline: Claude Code · Fable 5.1 · 2026-09-26 (MCP straight to ContextForge virtual servers; config version = image v0.8.7)
version: 1.3.13
cache: true

endpoints:
  custom:
    - name: "Platform (Portkey)"
      # Portkey ignores the bearer key; routing/auth is the x-portkey-config header.
      apiKey: "portkey"
      baseURL: "http://100.72.169.40:8787/v1"
      headers:
        x-portkey-config: "${PORTKEY_CHAT_CONFIG}"
      models:
        # Pseudo-model: the chat.json lane overrides provider+model per target
        # (kimi-k3 on NVIDIA NIM -> Ollama pool -> Gemini pool -> Groq/Cerebras/OpenRouter
        # -> NVIDIA pool -> Mistral). glm-5.1 removed 2026-09-25, owner blanket ban.
        default: ["platform-chat"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Platform chat (failover lane)"

# MCP tools come from ContextForge, the platform's one MCP front door (owner rule
# 2026-09-14: every MCP client connects to ContextForge). Each entry below is one
# ContextForge virtual server, addressed by its Tailscale Service name and named as
# in ContextForge. The bearer is a ContextForge client token held only in Coolify env.
# The 2026-08-29 design (a Portkey-published "platform-tools" endpoint) was never
# built: this Portkey is the OSS gateway with no MCP hosting, and the owner kept keys
# self-hosted rather than on Portkey cloud (2026-09-08).
mcpSettings:
  # LibreChat v0.8.7 treats 100.64.0.0/10 (the tailnet) as private and refuses MCP
  # connections there unless the exact host:port is exempted. A hostname entry trusts
  # whatever private address that name resolves to on this port. The list loads once
  # at startup: restart the container after changing it.
  allowedAddresses:
    - "contextforge.tilapia-skilift.ts.net:443"

mcpServers:
  agent-memory:
    type: streamable-http
    url: "https://contextforge.tilapia-skilift.ts.net/servers/a14b17330a3d432e8eb1a87369b8af8c/mcp"
    headers:
      Authorization: "Bearer ${CONTEXTFORGE_MCP_TOKEN}"
    timeout: 120000
  dev-docs:
    type: streamable-http
    url: "https://contextforge.tilapia-skilift.ts.net/servers/e6bf594590134686a2f10990c244f97b/mcp"
    headers:
      Authorization: "Bearer ${CONTEXTFORGE_MCP_TOKEN}"
    timeout: 120000
  propria-docstore-0-8:
    type: streamable-http
    url: "https://contextforge.tilapia-skilift.ts.net/servers/aca1b85df0ef49acaf152617f043bc96/mcp"
    headers:
      Authorization: "Bearer ${CONTEXTFORGE_MCP_TOKEN}"
    timeout: 120000
