# Docstore service image — the runtime dependency set, pinned by requirements.lock beside it.
# Byline: Claude Code · Opus 5 · 2026-09-28.
#
# ONE version line for the whole Docstore product (owner, 2026-09-28): this image, the
# Claude/Codex plugin in the propria-plugins marketplace, and plugins/docstore/control all carry
# it. The old three-sequence numbering (image 0.8.1-rN, plugin 0.8.6, control 0.6.2) is retired —
# it read as a downgrade when the image and the plugin were quoted in the same breath.
[project]
name = "propria-docstore"
version = "0.9.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cocoindex==1.0.21",
    "surrealdb==3.0.0b8",
    "fastmcp==3.2.4",
    "duckdb==1.5.5",
    "httpx==0.28.1",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-dotenv==1.2.3",
    "ftfy==6.3.1",
    "psutil==7.2.2",
    "litellm==1.102.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "surrealdb-embedded==3.0.0b8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "plugins/docstore/control/tests"]
addopts = "-p no:cacheprovider"
