</style></head><body><div class="shell"><aside class="rail"><strong>Source<br>ledger</strong><div class="legend"><span class="v">verified</span><span class="p">provisional</span><span class="s">stop</span></div></aside><main class="main"><div class="eyebrow">Authority and currentness audit</div><h1>What supports this?</h1><p id="summary">No source audit loaded.</p><section id="sources" class="empty">Run the source-audit tool to inspect authority, links, and review status.</section></main></div><script type="module">/*__EXT_APPS_BUNDLE__*/
