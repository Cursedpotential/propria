<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Checklist</title><style>
:root{color-scheme:light dark;--ink:#15243b;--blue:#2f5d8c;--teal:#147d73;--amber:#d88a1d;--red:#b33a3a;--surface:Canvas;--text:CanvasText;--muted:color-mix(in srgb,var(--text) 62%,transparent);--line:color-mix(in srgb,var(--text) 18%,transparent)}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text);font:14px/1.45 system-ui,sans-serif}.shell{border:1px solid var(--line);background:var(--surface);padding:20px}.head{display:flex;justify-content:space-between;gap:16px;align-items:start;border-bottom:3px solid var(--ink);padding-bottom:12px}.eyebrow,.count{font:700 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.eyebrow{color:var(--blue)}h1{margin:5px 0 0;font:700 clamp(22px,5vw,31px)/1.08 Georgia,serif;color:var(--ink)}@media(prefers-color-scheme:dark){h1{color:#c9dcf6}.head{border-color:#c9dcf6}}.count{border:1px solid var(--teal);color:var(--teal);padding:7px}.item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}.check{width:19px;height:19px;border:2px solid var(--blue);display:grid;place-items:center;color:#fff}.done .check{background:var(--teal);border-color:var(--teal)}.blocked .check{border-color:var(--red);color:var(--red)}.why{color:var(--muted);font-size:12px}.status{font:700 10px ui-monospace,monospace;text-transform:uppercase;color:var(--blue)}button{border:1px solid var(--blue);background:transparent;color:var(--text);padding:6px 9px;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.empty{padding:20px 0;color:var(--muted)}@media(max-width:500px){.shell{padding:16px}.head{display:block}.count{display:inline-block;margin-top:10px}.item{grid-template-columns:22px 1fr}.item button{grid-column:2;justify-self:start}}
</style></head><body><main class="shell"><header class="head"><div><div class="eyebrow">Practical checklist · review before filing</div><h1 id="title">Checklist</h1></div><span id="count" class="count">0 of 0</span></header><section id="items" class="empty">No checklist items loaded.</section></main><script type="module">/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const $=x=>document.getElementById(x);document.querySelector('main').setAttribute('aria-live','polite');const fail=msg=>{$('title').textContent='Checklist unavailable';$('count').textContent='Error';$('items').className='empty';$('items').textContent=msg};const parse=e=>{if(e?.isError)throw Error('The checklist tool reported an error.');if(e?.structuredContent&&typeof e.structuredContent==='object')return e.structuredContent;const t=e?.content?.find(x=>x.type==='text')?.text;if(!t)throw Error('The checklist tool returned no data.');const d=JSON.parse(t);if(!d||typeof d!=='object')throw Error('Malformed checklist data.');return d};const send=async(app,text)=>{try{await app.sendMessage({role:'user',content:[{type:'text',text}]})}catch{fail('The request could not be sent. Reopen the checklist and try again.')}};(async()=>{const app=new App({name:'Family Court Checklist',version:'2.0.0'},{});$('title').textContent='Loading checklist…';app.ontoolresult=e=>{try{const d=parse(e);if(typeof d.kind!=='string'||!Array.isArray(d.items))throw Error('Malformed checklist data.');$('title').textContent=`${d.kind} checklist`;const a=d.items,done=a.filter(x=>x.done===true).length;$('count').textContent=`${done} of ${a.length}`;const rows=[];if(d.warning){const w=document.createElement('div');w.className='warning';w.setAttribute('role','status');w.textContent=d.warning;rows.push(w)}for(const [i,x] of a.entries()){if(!x.id||!x.label||typeof x.done!=='boolean')throw Error('Malformed checklist item.');const s=x.done?'done':'open',r=document.createElement('article');r.className=`item ${s}`;const c=document.createElement('span');c.className='check';c.textContent=x.done?'✓':'';c.setAttribute('role','img');c.setAttribute('aria-label',x.done?'Completed':'Not completed');const copy=document.createElement('div'),b=document.createElement('strong'),btn=document.createElement('button');b.textContent=x.label;btn.textContent=x.done?'Review':'Work on it';btn.onclick=()=>send(app,`Help me ${x.done?'review':'complete'} this checklist item: ${x.label}. Do not assume missing facts.`);copy.append(b);r.append(c,copy,btn);rows.push(r)}$('items').className='';$('items').replaceChildren(...rows);if(!rows.length){$('items').className='empty';$('items').textContent='No checklist items were returned.'}}catch(err){fail(err.message)}};try{await app.connect()}catch{fail('Could not connect to the checklist tool.')}})();
</script><style>@media(prefers-color-scheme:dark){:root{--blue:#8fc7ff;--teal:#66e0ce;--red:#ff9292;--amber:#ffc66a;--muted:color-mix(in srgb,var(--text) 78%,transparent)}}button{min-height:44px}button:disabled{cursor:not-allowed;opacity:.55}.warning{padding:12px;border-left:4px solid var(--red);color:var(--text);background:color-mix(in srgb,var(--red) 9%,var(--surface))}</style></body></html>
