const {App}=globalThis.ExtApps;const $=x=>document.getElementById(x);document.querySelector('main').setAttribute('aria-live','polite');const meter=$('fill').parentElement;meter.setAttribute('role','progressbar');meter.setAttribute('aria-valuemin','0');meter.setAttribute('aria-valuemax','100');$('next').disabled=true;let nextLabel='';const fail=msg=>{$('title').textContent='Packet plan unavailable';$('sections').className='empty';$('sections').textContent=msg;$('fill').style.width='0%';meter.setAttribute('aria-valuenow','0');$('next').disabled=true};const parse=e=>{if(e?.isError)throw Error('The packet tool reported an error.');if(e?.structuredContent&&typeof e.structuredContent==='object')return e.structuredContent;const t=e?.content?.find(x=>x.type==='text')?.text;if(!t)throw Error('The packet tool returned no data.');const d=JSON.parse(t);if(!d||typeof d!=='object')throw Error('Malformed packet data.');return d};const send=async(app,text)=>{try{await app.sendMessage({role:'user',content:[{type:'text',text}]})}catch{fail('The request could not be sent. Reopen the packet plan and try again.')}};(async()=>{const app=new App({name:'Custody Packet Plan',version:'2.0.0'},{});$('title').textContent='Loading packet plan…';app.ontoolresult=e=>{try{nextLabel='';const d=parse(e);if(!Array.isArray(d.sections)||typeof d.releaseStatus!=='string')throw Error('Malformed packet data.');const stop=d.releaseStatus.toUpperCase()==='STOP_AND_VERIFY'||Boolean(d.stopConditions?.length),a=d.sections,done=a.filter(x=>String(x.status).toLowerCase()==='done').length,p=a.length?Math.round(done/a.length*100):0;$('title').textContent=`Packet plan · ${d.releaseStatus}`;$('fill').style.width=`${p}%`;meter.setAttribute('aria-valuenow',String(p));meter.setAttribute('aria-valuetext',`${done} of ${a.length} sections complete`);const rows=[];for(const warning of d.stopConditions||[]){const r=document.createElement('div');r.className='section blocked';const m=document.createElement('span');m.className
