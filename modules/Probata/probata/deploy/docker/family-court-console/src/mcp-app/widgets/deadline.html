<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadline Check</title><style>
:root{color-scheme:light dark;--ink:#15243b;--blue:#2f5d8c;--teal:#147d73;--amber:#d88a1d;--red:#b33a3a;--surface:Canvas;--text:CanvasText;--muted:color-mix(in srgb,var(--text) 62%,transparent);--line:color-mix(in srgb,var(--text) 18%,transparent)}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text);font:14px/1.45 system-ui,sans-serif}.shell{border:1px solid var(--line);background:var(--surface);padding:20px;position:relative;overflow:hidden}.shell:before{content:'TIME';position:absolute;right:-12px;top:30px;color:color-mix(in srgb,var(--blue) 10%,transparent);font:800 72px/1 ui-monospace,monospace;pointer-events:none}.eyebrow,.stamp{font:700 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.11em}.eyebrow{color:var(--blue)}h1{position:relative;margin:5px 0;font:700 clamp(21px,5vw,31px)/1.1 Georgia,serif;color:var(--ink)}@media(prefers-color-scheme:dark){h1{color:#c9dcf6}}.date{position:relative;display:flex;align-items:baseline;gap:12px;margin:20px 0 8px;border-left:6px solid var(--amber);padding:4px 14px}.date strong{font:800 clamp(25px,7vw,44px)/1 ui-monospace,monospace}.count{color:var(--red);font-weight:800}.basis{display:grid;grid-template-columns:8rem 1fr;border-top:1px solid var(--line);padding:10px 0;gap:10px}.basis span:first-child{color:var(--muted);font:700 10px ui-monospace,monospace;text-transform:uppercase}.warning{margin-top:12px;border-left:4px solid var(--red);padding:10px 12px;background:color-mix(in srgb,var(--red) 8%,var(--surface))}.actions{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 12px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--text)}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}@media(max-width:480px){.shell{padding:16px}.basis{grid-template-columns:1fr;gap:2px}}
</style></head><body><main class="shell"><div class="eyebrow">Deadline estimate · verify with the court</div><h1 id="label">No deadline calculated</h1><div class="date"><strong id="due">—</strong><span id="count" class="count"></span></div><div class="basis"><span>Trigger date</span><span id="trigger">Not supplied</span></div><div class="basis"><span>Rule basis</span><span id="basis">Not supplied</span></div><div class="basis"><span>Assumptions</span><span id="assumptions">None loaded</span></div><section id="warnings" class="warning">Court closures, service method, filing type, and local rules can change a deadline. Confirm before relying on this estimate.</section><div class="actions"><button id="verify">Verify this deadline</button><button id="calendar" class="secondary">Make a calendar plan</button></div></main><script type="module">/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const $=x=>document.getElementById(x);document.querySelector('main').setAttribute('aria-live','polite');for(const b of document.querySelectorAll('button'))b.disabled=true;const disable=v=>{$('verify').disabled=v;$('calendar').disabled=v};const fail=msg=>{$('label').textContent='Deadline unavailable';$('due').textContent='—';$('count').textContent='';$('trigger').textContent='Not available';$('basis').textContent='Not available';$('assumptions').textContent='Not available';$('warnings').textContent=msg;disable(true)};const parse=e=>{if(e?.isError)throw Error('The deadline tool reported an error.');if(e?.structuredContent&&typeof e.structuredContent==='object')return e.structuredContent;const t=e?.content?.find(x=>x.type==='text')?.text;if(!t)throw Error('The deadline tool returned no data.');const d=JSON.parse(t);if(!d||typeof d!=='object')throw Error('Malformed deadline data.');return d};const send=async(app,text)=>{try{await app.sendMessage({role:'user',content:[{type:'text',text}]})}catch{fail('The request could not be sent. Reopen the deadline and try again.')}};(async()=>{const app=new App({name:'Court Deadline Check',version:'2.0.0'},{});$('label').textContent='Calculating deadline…';app.ontoolresult=e=>{try{const d=parse(e);if(!d.anchorDate||!d.rawDate||!d.adjustedDate||!Number.isFinite(d.days))throw Error('Malformed deadline data.');$('label').textContent=`${d.direction||'Forward'} ${d.days} days from anchor`;$('due').textContent=d.adjustedDate;$('count').textContent=d.adjustment||'No calendar adjustment stated';$('trigger').textContent=d.anchorDate;$('basis').textContent=`Raw date: ${d.rawDate}`;$('assumptions').textContent=`Direction: ${d.direction||'not stated'}; days: ${d.days}`;$('warnings').textContent=d.warning||'Verify the governing rule, service method, court closures, and local practice before relying on this estimate.';disable(false)}catch(err){fail(err.message)}};$('verify').onclick=()=>send(app,`Verify the adjusted deadline ${$('due').textContent}, including the anchor, direction, court-day adjustment, and official authority.`);$('calendar').onclick=()=>send(app,`Build a conservative preparation calendar working backward from ${$('due').textContent}. Do not treat the date as verified.`);try{await app.connect()}catch{fail('Could not connect to the deadline tool.')}})();
</script><style>@media(prefers-color-scheme:dark){:root{--blue:#8fc7ff;--teal:#66e0ce;--red:#ff9292;--amber:#ffc66a;--muted:color-mix(in srgb,var(--text) 78%,transparent)}button:not(.secondary){color:#15243b}}button{min-height:44px}button:disabled{cursor:not-allowed;opacity:.55}.basis span:first-child{font-size:12px}</style></body></html>
