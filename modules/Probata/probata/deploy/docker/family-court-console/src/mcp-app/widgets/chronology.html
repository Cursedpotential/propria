<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Chronology</title><style>

const {App}=globalThis.ExtApps;const $=x=>document.getElementById(x);document.querySelector('main').setAttribute('aria-live','polite');const iso=v=>/^\d{4}-\d{2}-\d{2}(?:T.*)?$/.test(String(v));const fail=msg=>{$('title').textContent='Chronology unavailable';$('horizon').textContent='Error';$('timeline').className='timeline empty';$('timeline').textContent=msg};const parse=e=>{if(e?.isError)throw Error('The chronology tool reported an error.');if(e?.structuredContent&&typeof e.structuredContent==='object')return e.structuredContent;const t=e?.content?.find(x=>x.type==='text')?.text;if(!t)throw Error('The chronology tool returned no data.');const d=JSON.parse(t);if(!d||typeof d!=='object')throw Error('Malformed chronology data.');return d};const send=async(app,text)=>{try{await app.sendMessage({role:'user',content:[{type:'text',text}]})}catch{fail('The request could not be sent. Reopen the chronology and try again.')}};(async()=>{const app=new App({name:'Case Chronology',version:'2.0.0'},{});$('title').textContent='Loading chronology…';app.ontoolresult=e=>{try{const d=parse(e);if(!Array.isArray(d.events))throw Error('Malformed chronology data.');$('title').textContent='Case chronology';$('horizon').textContent='Occurrence and knowledge dates';const rows=[];if(d.warning){const w=document.createElement('article');w.className='event disputed';const t=document.createElement('div');t.className='title';t.textContent='Warning';const p=document.createElement('div');p.className='detail';p.textContent=d.warning;w.append(t,p);rows.push(w)}for(const [i,x] of d.events.entries()){if(!x.date||!x.title||!x.source)throw Error('Malformed chronology event.');const r=document.createElement('article');r.className='event';const date=document.createElement('time'),title=document.createElement('div'),detail=document.createElement('div'),source=document.createElement('div'),ask=document.createElement('button');date.className='date';date.textContent=x.date;if(iso(x.date))date.dateTime=x.date;
