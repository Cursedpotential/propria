</style></head><body><div class="shell"><div class="rail"></div><main><div class="eyebrow">Issue routing · informational only</div><h1 id="issue">Find the right lane</h1><p id="why" class="why">Describe the issue through the routing tool to see the likely process and its limits.</p><div class="route"><span class="stamp">Likely route</span><strong id="route">Awaiting issue details</strong></div><section><h2>Why this route</h2><div id="reasons" class="empty">No reasoning loaded.</div></section><section id="stopBox" class="stop" hidden><h2>Pause and get qualified help</h2><div id="stops"></div></section><section><h2>Next actions</h2><div id="next" class="empty">No actions loaded.</div></section><div class="actions"><button id="continue">Continue with this route</button><button id="correct" class="secondary">Correct the issue details</button></div></main></div><script type="module">/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const $=x=>document.getElementById(x);document.querySelector('main').setAttribute('aria-live','polite');for(const b of document.querySelectorAll('button'))b.disabled=true;const fill=(id,items)=>{const box=$(id),a=Array.isArray(items)?items:items?[items]:[];box.className=a.length?'':'empty';box.replaceChildren(...a.map(x=>{const n=document.createElement('div');n.className='item';n.textContent=typeof x==='string'?x:(x.label||x.title||x.reason||x.code||JSON.stringify(x));return n}));if(!a.length)box.textContent='None returned.'};const fail=msg=>{$('issue').textContent='Routing unavailable';$('why').textContent=msg;$('route').textContent='ERROR';$('continue').disabled=true;$('correct').disabled=true;$('stopBox').hidden=false;fill('stops',[msg]);fill('reasons',[]);fill('next',[])};const parse=e=>{if(e?.isError)throw Error('The routing tool reported an error.');if(e?.structuredContent&&typeof e.structuredContent==='object')return e.structuredContent;const t=e?.content?.find(x=>x.type==='text')?.text;if(!t)throw Error('The routing tool returned no data.');const d=JSON.parse(t);if(!d||typeof d!=='object')throw Error('Malformed routing data.');return d};const send=async(app,text)=>{try{await app.sendMessage({role:'user',content:[{type:'text',text}]})}catch{fail('The request could not be sent. Reopen the route and try again.')}};(async()=>{const app=new App({name:'Custody Issue Router',version:'2.0.0'},{});$('route').textContent='Loading';app.ontoolresult=e=>{try{const d=parse(e);if(typeof d.status!=='string'||!Array.isArray(d.nextActions))throw Error('Malformed routing data.');const stop=d.status.toUpperCase()==='STOP_AND_VERIFY';$('issue').textContent='Issue routing result';$('route').textContent=d.status;$('why').textContent=d.warning||'Review every flag before using this route.';fill('reasons',d.flags);fill('next',d.nextActions);$('stopBox').hidden=!stop;if(stop)fill('stops',['Stop and verify before continuing.',d.warning].filter(Boolean));$('continue').textContent=stop?'Verification required':'Continue with this route';$('continue').disabled=stop||!d.nextActions.length;$('correct').disabled=false}catch(err){fail(err.message)}};$('continue').onclick=()=>send(app,`Continue with routing status ${$('route').textContent}. Confirm assumptions first.`);$('correct').onclick=()=>send(app,'Ask me the minimum questions needed to correct this family-court issue route.');try{await app.connect()}catch{fail('Could not connect to the routing tool.')}})();
</script><style>@media(prefers-color-scheme:dark){:root{--blue:#8fc7ff;--teal:#66e0ce;--red:#ff9292;--amber:#ffc66a;--muted:color-mix(in srgb,var(--text) 78%,transparent)}button:not(.secondary){color:#15243b}}button{min-height:44px}button:disabled{cursor:not-allowed;opacity:.55}.stamp{font-size:12px}</style></body></html>
