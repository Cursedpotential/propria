# Proffer worker — dedicated Coolify application.
#
# This service does not replace the existing Python temporal-worker. It polls
# only ${TEMPORAL_TASK_QUEUE}, which must be a dedicated proffer queue and is
# rejected at startup if set to evidence-pipeline.
#
# Coolify watch paths — see deploy/WATCH-PATHS.md for the exact value to paste
# into Coolify's Watch Paths field for this app. As of the vendored-build repair
# (2026-09-02) they are:
#   modules/engine/**
#   deploy/docker/proffer-worker/**
#   deploy/proffer-worker.yaml
# modules/forks/sbv/** is deliberately NOT a watch path: the Go module vendor
# snapshot under modules/engine/vendor/ is what the build actually reads, and it
# only changes when someone re-runs `go mod vendor` (which touches
# modules/engine/vendor/**, already covered above).
#
# Host preparation (once):
#   install -d -o 10001 -g 10001 -m 0750 \
#     /data/probata/volumes/proffer/source-objects \
#     /data/probata/volumes/proffer/parser-bundles \
#     /data/probata/volumes/proffer/normalized-bundles \
#     /data/probata/volumes/proffer/inventory-manifests
#
# The parser-activity-runtime Coolify app must mount the same host
# /data/probata/volumes/proffer/parser-bundles directory at
# /data/proffer/parser-bundles.
# Stored file:// paths are container-visible authority locators, so changing
# only one side's mount path will fail closed.
#
# Byline: Codex · GPT-5 · 2026-08-29 (fixed Case Bible Sorted runtime secret)
# Byline: Codex · GPT-5.6-Sol · 2026-08-30 (direct-tailnet host networking)
# Byline: Codex · GPT-5.6-Terra · 2026-08-30 (rotatable n8n runtime-file auth)
# Byline: Claude Code · Sonnet 5 · 2026-09-02 (BUILD LANE D1: hermetic vendored
# build post-restructure — build context set to repo root so
# deploy/docker/proffer-worker/Dockerfile's `COPY modules/engine/`
# resolves; dockerfile path made explicit and repo-root-relative)
# Byline: Claude Code · Fable 5.1 · 2026-09-20 (host networking -> bridge + probata)

services:
  proffer-worker:
    build:
      context: .
      dockerfile: deploy/docker/proffer-worker/Dockerfile
    image: ${PROFFER_WORKER_IMAGE:-platform-proffer-worker:latest}
    restart: unless-stopped
    # CORRECTED 2026-09-20 (owner: "not sure why they were different to begin
    # with, fix it"): back on bridge + the shared `probata` network like every
    # other app. Host networking (2026-08-30) was a workaround for Docker's
    # exhausted default address pool; that is fixed on both hosts
    # (/etc/docker/daemon.json default-address-pools 10.200.0.0/16 size 24).
    # No inbound listener exists, so nothing is published. Probed live from a
    # `probata` bridge container before the change: 100.91.190.107:7233 / :5678 /
    # :5432 all connect.
    # Service names (owner 2026-09-20 18:41 "fix it"): TEMPORAL_HOST_PORT is
    # `temporal-server:7233` on `probata` (Temporal now binds every interface,
    # deploy/temporal/compose.temporal.yaml BIND_ON_IP). n8n is a Coolify
    # service on the `coolify` destination network, not `probata`, so the worker
    # joins `coolify` as well and N8N_PROFFER_BASE_URL is
    # `http://n8n-ddjgrmys36d9n8xwcwj0mml2:5678/webhook`. Use that full alias:
    # the short name `n8n` falls through the ts.net search domain to the
    # tailnet node instead of the container.
    networks:
      - probata
      - coolify
    environment:
      PLATFORM_DATABASE_URL_FILE: /run/secrets/platform-database-url
      TEMPORAL_HOST_PORT: ${TEMPORAL_HOST_PORT:?set}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-proffer-v1}
      N8N_PROFFER_BASE_URL: ${N8N_PROFFER_BASE_URL:?set}
      N8N_PROFFER_AUTH_HEADER: ${N8N_PROFFER_AUTH_HEADER:?set}
      N8N_PROFFER_AUTH_VALUE_FILE: /run/secrets/n8n-proffer-auth
      # Optional extra-flow registry. If set, it must name an absolute,
      # read-only mounted JSON file; a missing or invalid file stops startup.
      N8N_FLOW_BINDINGS_FILE: ${N8N_FLOW_BINDINGS_FILE:-}
      SELECT_PARSER_HTTP_TIMEOUT: ${SELECT_PARSER_HTTP_TIMEOUT:-35s}
      EXECUTE_PARSER_HTTP_TIMEOUT: ${EXECUTE_PARSER_HTTP_TIMEOUT:-31m}
      SOURCE_OBJECT_DIR: /data/proffer/source-objects
      PARSER_BUNDLE_DIR: /data/proffer/parser-bundles
      NORMALIZED_BUNDLE_DIR: /data/proffer/normalized-bundles
      INVENTORY_MANIFEST_DIR: /data/proffer/inventory-manifests
      DERIVE_SCRATCH_DIR: /data/proffer/derive-scratch
      # Where a derivation's output goes. UNSET (today) means it is published
      # beside the original exactly as before. Set it to a JSON list of
      # {"source","derived"} locator-prefix pairs to move derived output under
      # its own vault root, mirroring the source tree inside it; longest
      # matching source prefix wins, and a derivation already published beside
      # an original is still found and reused. A malformed value, or one naming
      # a scheme absent from OBJECT_STORES_JSON, fails worker startup loudly.
      # The target vault is not built yet (owner 2026-09-21), so no default.
      # Literal on purpose: Compose ends a ${VAR:-default} at the first '}'.
      DERIVED_ROOTS_JSON: ''
      PLATFORM_TOOLS_BASE_URL: ${PLATFORM_TOOLS_BASE_URL:?set}
      CASEBIBLE_R2_CONFIG_PATH: /run/secrets/casebible-r2.json
      # Storage providers are configuration, not code (owner 2026-09-20). Any S3-compatible
      # store: scheme -> credential file. Switching provider = a credential file + these two
      # values, identical in every Proffer/Workbench service. The first root is the default.
      # Literal on purpose: Compose ends a ${VAR:-default} at the first '}', which JSON contains.
      OBJECT_STORES_JSON: '{"b2":"/run/secrets/casebible-b2.json","r2":"/run/secrets/casebible-r2.json"}'
      SOURCE_ROOTS_JSON: '[{"id":"b2-vault","label":"B2 / Vault","url":"b2://salem-data/consignatio/vault/v1/"},{"id":"b2-bucket","label":"B2 / salem-data (whole bucket)","url":"b2://salem-data/"},{"id":"r2-sorted","label":"R2 / Case Bible Sorted","url":"r2://casebible-sorted/","temporary":true},{"id":"r2-raw","label":"R2 / Case Bible Raw","url":"r2://casebible-raw/","temporary":true},{"id":"r2-quarantine","label":"R2 / Case Bible Quarantine","url":"r2://casebible-quarantine/","temporary":true}]'
      # Repair builder (2026-09-26): repair.find_other_version reads the catalog READ-ONLY
      # (role metabase_ro, default_transaction_read_only=on) and HEADs candidates in B2.
      INTAKE_DISCOVERY_PG_HOST: fgz1n7useplhk0t91uk7k1aw
      INTAKE_DISCOVERY_PG_PORT: '5432'
      INTAKE_DISCOVERY_PG_DATABASE: casebible
      INTAKE_DISCOVERY_PG_USER: metabase_ro
      INTAKE_DISCOVERY_PG_PASSWORD_FILE: /run/secrets/intake-catalog-readonly
      INTAKE_DISCOVERY_OBJECT_STORE: b2://salem-data
      # Entity/event extraction (2026-09-26): kimi-k3 on NVIDIA NIM; without the key only the
      # participant rules run. Byline: Claude Code · Opus 5.5 · 2026-09-26
      ENTITY_MODEL_API_KEY_FILE: /run/secrets/nvidia-api-key
      # Weaviate first (owner 2026-09-18, 2026-09-26; OD-06 answered 2026-10-01 07:17):
      # every run's extracted records become searchable in the owner-approved
      # the owner-approved collection of its kind before approval and the canonical commit. Required at startup.
      # Weaviate publishes on the ovh-files tailnet IP (coolify-proxy owns host 8080).
      # The embedder is the collection's own (NIM nemotron-3-embed-1b, 2048-d, text_nim).
      # Byline: Claude Code · Opus 5.5 · 2026-10-01
      CONTEXT_SEARCH_WEAVIATE_URL: ${CONTEXT_SEARCH_WEAVIATE_URL:-http://100.91.190.107:8082}
      # One owner-approved collection per record kind (owner 2026-10-02): messages and calls,
      # AI chats, documents. Only DocEvents20261001 may be created by the worker.
      # Messages and calls go to Proffer's own ProfferMsgEvents20261002, apart from the Case Bible's
      # MsgEvents20260918 (owner 2026-10-02: separate jobs, no duplicates).
      # Byline: Claude Code · Opus 5.5 · 2026-10-02; Claude Code · Sonnet · 2026-10-02
      # (2026-10-02, owner: Postgres holds every message and call; Weaviate holds only chunks.) On a run with the
      # conversation-chunk marker this stage skips messages and calls; the Python worker publishes ProfferChunks20261002
      # after the commit. This setting still serves older histories and the objects already in the collection.
      CONTEXT_SEARCH_MESSAGE_COLLECTION: ProfferMsgEvents20261002
      CONTEXT_SEARCH_AI_CHAT_COLLECTION: AiChatEvents20260918
      CONTEXT_SEARCH_DOCUMENT_COLLECTION: DocEvents20261001
      CONTEXT_SEARCH_CREATABLE_COLLECTIONS: DocEvents20261001
      CONTEXT_SEARCH_VECTOR_NAME: text_nim
      CONTEXT_SEARCH_EMBED_API_KEY_FILE: /run/secrets/nvidia-api-key
    volumes:
      - /data/probata/volumes/proffer/source-objects:/data/proffer/source-objects
      - /data/probata/volumes/proffer/parser-bundles:/data/proffer/parser-bundles
      - /data/probata/volumes/proffer/normalized-bundles:/data/proffer/normalized-bundles
      - /data/probata/volumes/proffer/inventory-manifests:/data/proffer/inventory-manifests
      # scratch for derive-sms (per-thread NDJSON before publish); data volume, never /tmp
      - /data/probata/volumes/proffer/derive-scratch:/data/proffer/derive-scratch
      - /data/probata/secrets/casebible-r2.json:/run/secrets/casebible-r2.json:ro
      - /data/probata/secrets/casebible-b2.json:/run/secrets/casebible-b2.json:ro
      - /data/probata/secrets/n8n/proffer-auth:/run/secrets/n8n-proffer-auth:ro
      - /data/probata/secrets/platform/database-url:/run/secrets/platform-database-url:ro
      - /data/probata/secrets/intake-engine/metabase-ro:/run/secrets/intake-catalog-readonly:ro
      - /data/probata/secrets/intake-engine/nvidia-api-key:/run/secrets/nvidia-api-key:ro
      # Tool gateway service token (D-132): the worker calls platform-tools ONLY through
      # the gateway and fails closed at startup without this file. Copied from ovh-app
      # /data/probata/secrets/tool-gateway/service-token on 2026-09-05.
      - /data/probata/secrets/tool-gateway/service-token:/run/secrets/tool-gateway-service-token:ro

networks:
  probata:
    external: true
  coolify:
    external: true
