# =============================================================================
# FAMILY-COURT-CONSOLE — the family-court-toolkit MCP console served over MCP
# Streamable HTTP in the cloud and federated through ContextForge (owner
# rulings 2026-09-07 16:16-17:12: "the console must run in the cloud as its
# own Coolify app"; "federated by ContextForge, so no client downloads
# anything"). One concern per app, same pattern as surreal-case.yaml and
# opencode-server.yaml. Deployed on ovh-files (server cn89l8801u8gsginw1rxq5qt,
# tailnet 100.91.190.107).
#
# Byline: Claude Code · Sonnet 5 · 2026-09-07
#
# BUILD SOURCE: the family-court-toolkit plugin (this MCP server's source,
# content/, skills/) lives OUTSIDE this repo, at
# E:/AI_Workspace/plugins/plugins/family-court-toolkit/ on the desktop — a
# Claude Code local plugin checkout, not a probata module. Coolify's git-based
# build can only see files committed here, so
# deploy/docker/family-court-console/src/ is a COMMITTED sync of that plugin's
# runtime subset (mcp-app/dist, mcp-app/package*.json, content/, skills/,
# Dockerfile.cloud, .dockerignore), produced by scripts/sync_family_court_console.sh.
# Re-run that script and commit the result whenever the plugin's mcp-app/src
# changes. See deploy/docker/family-court-console/README.md.
#
# Coolify env to set:
#   BIND_IP=100.91.190.107
#   MCP_BEARER_TOKEN            — the token ContextForge's gateway config presents
#                                  on every call; see plugins/family-court-toolkit/
#                                  docs/2026-09-07-case-store-registers.md
#                                  "Cloud console + ContextForge" (plugin checkout,
#                                  not this repo)
#   CUSTODY_CASE_DB_USER        — must equal surreal-case.yaml's SURREAL_USER
#   CUSTODY_CASE_DB_PASS        — must equal surreal-case.yaml's SURREAL_PASS
# Coolify Watch Paths: deploy/family-court-console.yaml deploy/docker/family-court-console
# HOST-PREP: none — this app is stateless (no volume; case data lives in
#   surreal-case, not here).
# Tailnet-only by BIND_IP AND by the host DOCKER-USER rules (commit 7d4583d).
#
# INGRESS: Traefik/Authentik labels are PRE-WIRED (same shape as
# opencode-server.yaml). traefik.enable stays false -- the public
# family-court.int.mitechconsult.com route (owner decision 2026-09-27 02:46 EDT) is added to
# modules/Consignatio/docs/receipts/portal/propria-public-portal.yaml instead, same pattern as
# openlist/opencode-server/fileflows: that file governs, these labels never activate.
# ContextForge is the access path for Claude Code and Codex: gateway `family-court` (4fb64f88c1bf4b4d8863658e32d98403,
# BIND_IP:9077/mcp, MCP_BEARER_TOKEN held inside ContextForge) and virtual server `family-court-console`
# (0b85f64905be468ba477d75cb2a80323), registered 2026-10-03 (Claude Code · Sonnet 5.5). The clients carry only
# ContextForge's own token.
#
# WEB APP (2026-09-28, Claude Code · Opus 5.5): the same port also serves the Family Law Toolkit
# web app on / and /api/* (src/mcp-app/src/web.ts). Tailnet: svc:family-court ->
# https://family-court.tilapia-skilift.ts.net (tailscale serve on ovh-files -> BIND_IP:9077).
# Public: family-court.int.mitechconsult.com via the router above. Auth is src/mcp-app/src/
# web-auth.ts and the TRUSTED_* env below; a direct BIND_IP:9077 caller gets 403.
#
# PORT: host port changed 8765 -> 9077 (2026-09-27, Claude Code). 8765 was this app's port since
# 2026-09-07 but this app never once deployed successfully (see the header note below), so nothing
# was ever listening on it; the Coolify app `superindex` (deployed 2026-09-22, healthy, live,
# receipt docs/receipts/2026-09-22-superindex-first-catalog-run.md) has genuinely owned host port
# 8765 on ovh-files since before this app ever bound anything. Moving family-court-console, not
# superindex. Registered as product code 77 in deploy/service-port-registry.json. The CONTAINER
# port stays 8765 (MCP_HTTP_PORT, healthcheck, traefik label below) -- only the host-side mapping
# moved.
# =============================================================================

services:
  family-court-console:
    build:
      context: ./deploy/docker/family-court-console/src
      dockerfile: Dockerfile.cloud
    container_name: family-court-console
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    ports:
      - "${BIND_IP:-127.0.0.1}:9077:8765"   # http://100.91.190.107:9077/mcp — tailnet-only (was :8765, moved 2026-09-27: superindex owns 8765)
    environment:
      MCP_TRANSPORT: "http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8765"
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN in Coolify env}
      CUSTODY_CASE_DB: ws://surreal-case:8000   # service DNS on the probata network — see surreal-case.yaml
      CUSTODY_CASE_DB_USER: ${CUSTODY_CASE_DB_USER:?set CUSTODY_CASE_DB_USER in Coolify env}
      CUSTODY_CASE_DB_PASS: ${CUSTODY_CASE_DB_PASS:?set CUSTODY_CASE_DB_PASS in Coolify env}
      # Family Law Toolkit web app (src/mcp-app/src/web-auth.ts, the Workbench's trusted-proxy
      # model). Only the socket peer counts. Claude Code · Opus 5.5 · 2026-09-28.
      #   Serve peer: tailscaled on this host proxying svc:family-court to BIND_IP:9077.
      #   Auth peer:  Traefik on ovh-app (family-court.int, Authentik forward-auth), over the tailnet.
      TRUSTED_TAILSCALE_SERVE_PROXY_CIDRS: ${TRUSTED_TAILSCALE_SERVE_PROXY_CIDRS:-100.91.190.107/32}
      TRUSTED_AUTH_PROXY_CIDRS: ${TRUSTED_AUTH_PROXY_CIDRS:-100.72.169.40/32}
      TRUSTED_TAILSCALE_LOGINS: ${TRUSTED_TAILSCALE_LOGINS:-matt.salemnet@gmail.com}
      TAILSCALE_DEVICE_CAPABILITY: ${TAILSCALE_DEVICE_CAPABILITY:-}
    healthcheck:
      # node:22-bookworm-slim ships no curl; the app itself has no other HTTP
      # client dependency, so probe /healthz with a one-line node script.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - probata
    labels:
      # ---- route prepared, NOT open — ContextForge is the primary access path
      - traefik.enable=false
      - traefik.docker.network=probata
      - traefik.http.routers.family-court-console.rule=Host(`family-court.int.mitechconsult.com`)
      - traefik.http.routers.family-court-console.entrypoints=https
      - traefik.http.routers.family-court-console.tls=true
      - traefik.http.routers.family-court-console.tls.certresolver=letsencrypt
      - traefik.http.routers.family-court-console.service=family-court-console
      - traefik.http.routers.family-court-console.middlewares=family-court-console-authentik
      - traefik.http.services.family-court-console.loadbalancer.server.port=8765
      # Address fixed 2026-09-27 (was http://authentik-server:9000/..., a Docker DNS alias
      # Authentik does not trust): dial Authentik through the Tailscale Service svc:authentik
      # (raw TCP forwarder, VIP 100.66.241.25:9075) so the socket peer Authentik sees is always
      # the trusted proxy 100.72.169.40 (TRAEFIK_PROXY_CIDR=100.72.169.40/32). Same address the
      # file-provider's shared `authentik-forwardauth` middleware uses
      # (modules/Consignatio/docs/receipts/portal/propria-public-portal.yaml). This label stays
      # inert while traefik.enable=false above (ContextForge remains the primary access path
      # per this file's own header); fixed now for correctness/future-proofing.
      - 'traefik.http.middlewares.family-court-console-authentik.forwardauth.address=http://100.66.241.25:9075/outpost.goauthentik.io/auth/traefik'
      - traefik.http.middlewares.family-court-console-authentik.forwardauth.trustForwardHeader=true
      - 'traefik.http.middlewares.family-court-console-authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version'
      - coolify.traefik.middlewares=family-court-console-authentik

networks:
  probata:
    external: true
