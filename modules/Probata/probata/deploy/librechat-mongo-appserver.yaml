# Run the preserved LibreChat MongoDB on verified app-server data-disk directories.
# Inputs: the exact existing MongoDB image and a complete cold verified copy of
# both /data/db and the formerly anonymous /data/configdb volume, owned by 999:999.
# Outputs: MongoDB on the existing internal probata network with no host port.
# Effects: writes only transferred database state after the reviewed cutover.
# Pick for this rehost; deploy/librechat-mongo.yaml is the source-host rollback.
# Never start against partial or empty data, and never copy live WiredTiger files.
# Owner-authorized migration preparation, Codex GPT-6.1-sol, 2026-10-15.
services:
  librechat-mongo:
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    pull_policy: never
    restart: unless-stopped
    command: mongod --quiet
    volumes:
      - /mnt/data/probata/volumes/librechat/mongo:/data/db
      - /mnt/data/probata/volumes/librechat/configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "false"
    networks:
      probata:
        aliases:
          - librechat-mongo
networks:
  probata:
    external: true
