# DbGate: web database manager (tailnet only). Runs side by side with pgAdmin and CloudBeaver
# (owner 2026-09-23 08:21 "all 3 for now").
# Byline: Claude Code · Opus 5.5 · 2026-09-23.
#
# Connections are predefined server-side from /data/probata/secrets/dbgate/dbgate.env
# (CONNECTIONS, LABEL_/SERVER_/PORT_/USER_/PASSWORD_/ENGINE_/DATABASE_ per connection; 0600, built
# on the host from each PG container's own env by /data/probata/tools/prep_db_surfaces.py).
# There is no DbGate login: on the tailnet, Tailscale is the only barrier (owner 2026-09-23 08:06).
# HTTPS name: svc:dbgate → https://dbgate.tilapia-skilift.ts.net
services:
  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    ports:
      - "100.91.190.107:3002:3000"
    env_file:
      - /data/probata/secrets/dbgate/dbgate.env
    volumes:
      - /data/probata/volumes/dbgate:/root/.dbgate
