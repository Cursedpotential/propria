# Reviewed source example only. Not installed into user-level Codex configuration.
#
# Byline: Claude Code · Opus 5 · 2026-09-28 (0.9.0)
#
# Replaces the previous example, which was stale in three ways: it launched the control server
# as a local stdio process from `Propria/Probata/probata/...` (a pre-2026-09-20 path that no
# longer exists, the module now living under `modules/`), and it declared a second server
# pointing straight at the SurrealDB HTTP endpoint. The Docstore skill forbids that raw-database
# route -- clients go through the control MCP, which is what enforces scope and redaction.
#
# One server, matching .mcp.json: the hosted control MCP over HTTP, reached on the tailnet.
# DOCSTORE_CONTROL_MCP_URL is the ctl08 endpoint the 0.9.0 service publishes on :8175.

[mcp_servers.ctl]
url = "${DOCSTORE_CONTROL_MCP_URL}"
startup_timeout_sec = 30
tool_timeout_sec = 45

[mcp_servers.ctl.http_headers]
Authorization = "Bearer ${DOCSTORE_CONTROL_TOKEN}"
