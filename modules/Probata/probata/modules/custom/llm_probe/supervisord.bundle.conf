; Supervise both existing LLM Probe runtimes and stop the bundle on fatal startup failure.
; Inputs: existing API settings and compiled Next standalone output. Outputs: ports8000/3000.
; Effects: child lifecycle only. Pick for one-container deployment over two independent apps.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/llm-probe-supervisord.pid
loglevel=warn

[program:api]
directory=/app
command=python -m uvicorn llm_probe.main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ui]
directory=/opt/llm-probe-ui
command=python -m llm_probe.bundle_runtime ui
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:fatal-child]
directory=/app
command=python -m llm_probe.bundle_runtime fatal-listener
events=PROCESS_STATE_FATAL
buffer_size=10
startsecs=0
autorestart=unexpected
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
