services:
  tool-runner:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://mcp.mitechconsult.com/runner
      OAUTH_ISSUER: https://auth.int.mitechconsult.com/application/o/propria-gateway/
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?}
      MCP_URL: https://mcp.mitechconsult.com/servers/320572d2bdd440f3ac61c8b64418d7b3/mcp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.propria-runner.rule=Host(`mcp.mitechconsult.com`) && (PathPrefix(`/runner`) || Path(`/mcp`) || PathRegexp(`^/(n8n|docstore|storage|platform|think|search|admin)/mcp$`) || PathRegexp(`^/.well-known/oauth-protected-resource/(mcp|(n8n|docstore|storage|platform|think|search|admin)/mcp)$`))
      - traefik.http.routers.propria-runner.priority=100
      - traefik.http.routers.propria-runner.entrypoints=https
      - traefik.http.routers.propria-runner.tls=true
      - traefik.http.routers.propria-runner.tls.certresolver=letsencrypt
      - traefik.http.services.propria-runner.loadbalancer.server.port=8790
    networks: [coolify]
networks:
  coolify:
    external: true
