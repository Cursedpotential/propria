# N8N + Local PostgreSQL for Processing Pipeline
# This is for LOCAL PROCESSING before pushing to hosted databases
# 
# Usage:
#   cd "C:\Users\matts\AI Workspace\n8n-local"
#   docker-compose up -d
#
# Access N8N at: http://localhost:5678
# PostgreSQL at: localhost:5432

version: '3.8'

services:
  # Local PostgreSQL for N8N workflows and temp processing
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: <redacted:N8N_POSTGRES_PASSWORD>
      POSTGRES_DB: n8n_processing
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n_processing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_processing
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: <redacted:N8N_POSTGRES_PASSWORD>
      
      # N8N Settings
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      
      # Execution settings for large files
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: true
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true
      
      # Generic timezone
      GENERIC_TIMEZONE: America/Detroit
      TZ: America/Detroit
      
      # Enable community nodes
      N8N_COMMUNITY_PACKAGES_ENABLED: true
      
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:

networks:
  default:
    name: n8n-network
