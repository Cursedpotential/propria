version: '3.8'

services:
  # ==========================================
  # DATA LAYER
  # ==========================================

  # 1. Dragonfly (Drop-in Redis replacement, high performance)
  dragonfly:
    image: 'docker.io/dragonflydb/dragonfly'
    container_name: dragonfly
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    command: --requirepass ${DRAGONFLY_PASSWORD:-changeme}

  # 2. Postgres (Dedicated for N8N & Local Services)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=n8n
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ==========================================
  # AUTOMATION & ORCHESTRATION (The "Coordinator")
  # ==========================================

  # 3. N8N (Workflow Automation)
  # Acts as the "Manager" agent - can call MCP tools, decide workflows, and orchestrate.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.local}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/New_York
      # DB Connection
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-secure_key}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - postgres
      - dragonfly

  # ==========================================
  # AI INFERENCE & MIDDLEWARE
  # ==========================================

  # 4. Ollama (Remote Inference)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"

  # 5. Mem0 MCP (The "Gateway" for Memory/Graph/Vector)
  mem0-mcp:
    image: docker.io/mem0/openmemory-mcp:latest
    container_name: openmemory-mcp
    restart: always
    expose:
      - "8080"
    environment:
      # Cloud DB Connections
      - MEM0_DSN=${DATABASE_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      # Hosted Vector DB
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================
  # USER INTERFACES
  # ==========================================

  # 6. Open WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-default_secret}
      - ENABLE_RAG_WEB_SEARCH=true
      - MCP_SERVER_URL=http://mem0-mcp:8080
      - MEM0_POSTGRES_URI=${DATABASE_URL}
    volumes:
      - open-webui-data:/app/backend/data
      # Removed local file mounts for VPS compatibility
    depends_on:
      - ollama
      - mem0-mcp

  # 7. AnythingLLM
  anythingllm:
    image: docker.io/mintplexlabs/anythingllm
    container_name: anythingllm
    restart: always
    cap_add:
      - SYS_ADMIN
    environment:
      - STORAGE_DIR=/app/server/storage
      - JWT_SECRET=${JWT_SECRET:-anything_llm_secret}
    volumes:
      - anythingllm-data:/app/server/storage
      # Removed local file mounts for VPS compatibility
    depends_on:
      - ollama

  # 8. LibreChat
  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: librechat
    restart: always
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey123}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs
    depends_on:
      - mongodb
      - meilisearch
      - ollama

  # Dependencies for LibreChat
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    volumes:
      - mongodb-data:/data/db
    command: mongod --noauth

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: always
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey123}
    volumes:
      - meilisearch-data:/meili_data

volumes:
  postgres-data:
  n8n-data:
  ollama-data:
  open-webui-data:
  anythingllm-data:
  mongodb-data:
  meilisearch-data:
  librechat-images:
  librechat-logs: