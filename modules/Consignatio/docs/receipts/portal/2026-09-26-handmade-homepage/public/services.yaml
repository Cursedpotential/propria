# Byline: Codex · 2026-09-12 — unified project preview launchpad.
# A monitor is a reachability check, not proof a feature or lane is complete.
# Unavailable previews deliberately have no href. Credentials stay out of this file.
# 2026-09-14 (Claude Code · Sonnet 5): owner rejected the whole-board iframe here
# ("a little tiny window ... where I sit and scroll") — removed. "Project progress"
# is now a plain full-page link like every other tile; "Live board" and "Live board
# charts" below carry the native customapi widgets and the two ApexCharts cards
# (custom.js/custom.css) that replace it. See docs/URGENT-TODO.md for the record.
# 2026-09-15 (Claude Code · Sonnet 5): CORRECTED — the note above was accurate as of
# 2026-09-14 but is now stale (doc-drift rule: superseded statement kept, struck
# through, not deleted). The customapi widgets are fetched SERVER-SIDE by Homepage's
# own backend, which has no Authentik session — so any URL that has to cross the
# forward-auth gate (progress.int.mitechconsult.com OR homepage.int.mitechconsult.com)
# 404s/302s for that fetch. Fix: point these customapi `url:`s at progress-board's
# internal tailnet address (http://100.72.169.40:3020/api/...) instead, which is
# reachable directly from the homepage-public container on the "dashboards_default"
# bridge network without touching Traefik or Authentik at all (verified live
# 2026-09-15: `docker exec homepage-public wget -qO- http://100.72.169.40:3020/api/
# lane-rollups` returns JSON). Browser-facing `href:` links below stay on the public
# domain — they need the Authentik gate; the customapi `url:`s do not.
# ~~NOTE: progress.int.mitechconsult.com sits behind Authentik forward-auth (same as
# homepage.int.mitechconsult.com) with no service-account bypass, so the customapi
# widgets below cannot complete their server-side fetch on THIS public instance —
# they will show as errored/empty, which is the intended "one small flag", not a
# bug in this file.~~ The tailnet homepage's copy of these same widgets works live
# for the same reason: it fetches via its own tailnet hostname, not through Traefik/Authentik.

- Project progress:
    - Project progress:
        href: https://progress.int.mitechconsult.com/
        description: Surreal-backed lanes · in flight, done, upcoming, catalog and migration reports
        icon: mdi-view-dashboard-outline

- Live board:
    - Pipeline lanes:
        href: https://progress.int.mitechconsult.com/
        description: Observation counts per lane, live from Surreal
        icon: mdi-view-list-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/lane-rollups
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: lanes
            name: lane
            label: summary
            limit: 8
    - Live surfaces:
        href: https://progress.int.mitechconsult.com/health/
        description: Up / degraded / down across all previewed surfaces
        icon: mdi-lan-connect
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          mappings:
            - field: up
              label: Up
              format: number
            - field: degraded
              label: Degraded
              format: number
            - field: down
              label: Down
              format: number
            - field: total
              label: Total
              format: number
    - Surfaces needing attention:
        href: https://progress.int.mitechconsult.com/health/
        description: Degraded or down surfaces, from the live health probe
        icon: mdi-alert-octagon-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/surfaces-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: down_list
            name: name
            label: summary
            limit: 8
    - Health probes:
        href: https://progress.int.mitechconsult.com/health/
        description: Endpoint probe outcomes and latency percentiles
        icon: mdi-heart-pulse
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          mappings:
            - field: ok
              label: OK
              format: number
            - field: warn
              label: Warn
              format: number
            - field: fail
              label: Fail
              format: number
            - field: p50_ms
              label: p50
              format: text
              suffix: " ms"
            - field: p95_ms
              label: p95
              format: text
              suffix: " ms"
    - Slowest endpoints:
        href: https://progress.int.mitechconsult.com/health/
        description: Top 5 slowest probes this poll
        icon: mdi-speedometer-slow
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/health-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: slowest
            name: service
            label: summary
            limit: 5
    - Open to-dos:
        description: Open URGENT-TODO.md items, newest section first (synced copy)
        icon: mdi-checkbox-marked-outline
        widget:
          type: customapi
          url: http://100.72.169.40:3020/api/todo-feed
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: items
            name: area
            label: summary
            limit: 8

