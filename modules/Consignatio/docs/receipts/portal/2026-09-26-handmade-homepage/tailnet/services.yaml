# Byline: Codex · 2026-09-12 — unified project preview launchpad.
# A monitor is a reachability check, not proof a feature or lane is complete.
# Unavailable previews deliberately have no href. Credentials stay out of this file.
# 2026-09-14 (Claude Code · Sonnet 5): owner rejected the whole-board iframe here
# ("a little tiny window ... where I sit and scroll") — removed. "Project progress"
# is now a plain full-page link like every other tile; "Live board" and "Live board
# charts" below carry the native customapi widgets and the two ApexCharts cards
# (custom.js/custom.css) that replace it. See docs/URGENT-TODO.md for the record.

- Project progress:
    - Project progress:
        href: https://homepage.tilapia-skilift.ts.net/progress/
        description: Surreal-backed lanes · in flight, done, upcoming, catalog and migration reports
        icon: mdi-view-dashboard-outline

- Live board:
    - Pipeline lanes:
        href: https://homepage.tilapia-skilift.ts.net/progress/
        description: Observation counts per lane, live from Surreal
        icon: mdi-view-list-outline
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/lane-rollups
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: lanes
            name: lane
            label: summary
            limit: 8
    - Live surfaces:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Up / degraded / down across all previewed surfaces
        icon: mdi-lan-connect
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/surfaces-summary
          refreshInterval: 30000
          mappings:
            - field: up
              label: Up
              format: number
            - field: degraded
              label: Degraded
              format: number
            - field: down
              label: Down
              format: number
            - field: total
              label: Total
              format: number
    - Surfaces needing attention:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Degraded or down surfaces, from the live health probe
        icon: mdi-alert-octagon-outline
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/surfaces-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: down_list
            name: name
            label: summary
            limit: 8
    - Health probes:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Endpoint probe outcomes and latency percentiles
        icon: mdi-heart-pulse
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/health-summary
          refreshInterval: 30000
          mappings:
            - field: ok
              label: OK
              format: number
            - field: warn
              label: Warn
              format: number
            - field: fail
              label: Fail
              format: number
            - field: p50_ms
              label: p50
              format: text
              suffix: " ms"
            - field: p95_ms
              label: p95
              format: text
              suffix: " ms"
    - Slowest endpoints:
        href: https://homepage.tilapia-skilift.ts.net/progress/health/
        description: Top 5 slowest probes this poll
        icon: mdi-speedometer-slow
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/health-summary
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: slowest
            name: service
            label: summary
            limit: 5
    - Open to-dos:
        description: Open URGENT-TODO.md items, newest section first (synced copy)
        icon: mdi-checkbox-marked-outline
        widget:
          type: customapi
          url: https://homepage.tilapia-skilift.ts.net/progress/api/todo-feed
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: items
            name: area
            label: summary
            limit: 8

