# Tailnet short names (owner 2026-09-24 05:33-05:36, option A): <service>.mitechconsult.com redirects to
# https://<service>.tilapia-skilift.ts.net. It works on tailnet devices only, where the ts.net name resolves.
# Off the tailnet the public route stays <service>.int.mitechconsult.com, behind Authentik.
# DNS: DNS-only A records <service>.mitechconsult.com -> 40.160.5.19 (Cloudflare, set 2026-09-24).
# Deployed copy: ovh-app /data/coolify/proxy/dynamic/propria-tailnet-shortnames.yaml. This file is the tracked copy.
# One service name per tailnet Service (svc:<name>); add a name here and a DNS record when a Service is added.
http:
  middlewares:
    tailnet-shortname-redirect:
      redirectRegex:
        regex: '^https?://([a-z0-9-]+)\.mitechconsult\.com(.*)$'
        replacement: 'https://${1}.tilapia-skilift.ts.net${2}'
        permanent: false
  routers:
    tailnet-shortnames:
      rule: "Host(`attu.mitechconsult.com`) || Host(`authentik.mitechconsult.com`) || Host(`cloudbeaver.mitechconsult.com`) || Host(`contextforge.mitechconsult.com`) || Host(`coolify.mitechconsult.com`) || Host(`coolify-mcp.mitechconsult.com`) || Host(`dbgate.mitechconsult.com`) || Host(`desk.mitechconsult.com`) || Host(`devbox.mitechconsult.com`) || Host(`docstore-api.mitechconsult.com`) || Host(`fileflows.mitechconsult.com`) || Host(`files.mitechconsult.com`) || Host(`filestash.mitechconsult.com`) || Host(`homepage.mitechconsult.com`) || Host(`infisical.mitechconsult.com`) || Host(`legal.mitechconsult.com`) || Host(`legal-api.mitechconsult.com`) || Host(`librechat.mitechconsult.com`) || Host(`llm-probe.mitechconsult.com`) || Host(`llm-probe-ui.mitechconsult.com`) || Host(`metabase.mitechconsult.com`) || Host(`n8n.mitechconsult.com`) || Host(`neo4j.mitechconsult.com`) || Host(`opencode.mitechconsult.com`) || Host(`pgadmin.mitechconsult.com`) || Host(`platform-api.mitechconsult.com`) || Host(`platform-tools.mitechconsult.com`) || Host(`portal-edit.mitechconsult.com`) || Host(`portkey.mitechconsult.com`) || Host(`spacedrive-gate.mitechconsult.com`) || Host(`surreal.mitechconsult.com`) || Host(`surreal-docs.mitechconsult.com`) || Host(`surreal-intake.mitechconsult.com`) || Host(`surrealist.mitechconsult.com`) || Host(`temporal.mitechconsult.com`) || Host(`tool-gateway.mitechconsult.com`) || Host(`weaviate.mitechconsult.com`) || Host(`weaviate-ui.mitechconsult.com`) || Host(`workbench.mitechconsult.com`)"
      entryPoints: ["https"]
      middlewares: ["tailnet-shortname-redirect"]
      service: noop@internal
      tls:
        certResolver: letsencrypt
    tailnet-shortnames-http:
      rule: "Host(`attu.mitechconsult.com`) || Host(`authentik.mitechconsult.com`) || Host(`cloudbeaver.mitechconsult.com`) || Host(`contextforge.mitechconsult.com`) || Host(`coolify.mitechconsult.com`) || Host(`coolify-mcp.mitechconsult.com`) || Host(`dbgate.mitechconsult.com`) || Host(`desk.mitechconsult.com`) || Host(`devbox.mitechconsult.com`) || Host(`docstore-api.mitechconsult.com`) || Host(`fileflows.mitechconsult.com`) || Host(`files.mitechconsult.com`) || Host(`filestash.mitechconsult.com`) || Host(`homepage.mitechconsult.com`) || Host(`infisical.mitechconsult.com`) || Host(`legal.mitechconsult.com`) || Host(`legal-api.mitechconsult.com`) || Host(`librechat.mitechconsult.com`) || Host(`llm-probe.mitechconsult.com`) || Host(`llm-probe-ui.mitechconsult.com`) || Host(`metabase.mitechconsult.com`) || Host(`n8n.mitechconsult.com`) || Host(`neo4j.mitechconsult.com`) || Host(`opencode.mitechconsult.com`) || Host(`pgadmin.mitechconsult.com`) || Host(`platform-api.mitechconsult.com`) || Host(`platform-tools.mitechconsult.com`) || Host(`portal-edit.mitechconsult.com`) || Host(`portkey.mitechconsult.com`) || Host(`spacedrive-gate.mitechconsult.com`) || Host(`surreal.mitechconsult.com`) || Host(`surreal-docs.mitechconsult.com`) || Host(`surreal-intake.mitechconsult.com`) || Host(`surrealist.mitechconsult.com`) || Host(`temporal.mitechconsult.com`) || Host(`tool-gateway.mitechconsult.com`) || Host(`weaviate.mitechconsult.com`) || Host(`weaviate-ui.mitechconsult.com`) || Host(`workbench.mitechconsult.com`)"
