[project]
name = "casebible-cocoindex"
version = "0.1.0"
description = "Incremental Case Bible text indexing, NIM enrichment, portable Parquet, and DuckDB semantic search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "blake3>=1.0.0",
    "charset-normalizer>=3.4.0",
    "cocoindex>=1.0.14",
    "duckdb>=1.4.0",
    "pytz>=2026.3",  # Byline: Claude Code · Sonnet 5 · 2026-09-14 -- duckdb needs this to
    # convert TIMESTAMPTZ columns (source_created_at etc.) via fetchone/fetchall.
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.0",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.0",
    "striprtf>=0.0.29",
    "surrealdb==2.0.0",
    "textual>=6.1.0",
    "typer>=0.16.0",
    "tzdata>=2025.2",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[project.scripts]
casebible-corpus = "casebible_index.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casebible_index"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
