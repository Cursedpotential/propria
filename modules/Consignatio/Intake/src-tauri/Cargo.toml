[package]
name = "casebible-workbench"
version = "0.1.0"
description = "Local-first Case Bible review workbench"
authors = ["Matthew Salem"]
edition = "2021"

[lib]
name = "casebible_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

