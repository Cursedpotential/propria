[project]
name = "casebible-r2-b2-manifest"
version = "0.1.0"
description = "Non-destructive R2 inventory ledger and deterministic B2 transfer manifest builder"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["duckdb>=1.4,<2"]

[project.scripts]
r2-b2-manifest = "r2_b2_manifest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2_b2_manifest"]
