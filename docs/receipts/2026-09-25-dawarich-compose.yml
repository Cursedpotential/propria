# Dawarich (self-hosted location history) — Propria deploy on ovh-files (100.91.190.107)
# Deployed as Coolify service. Modified from upstream freikin/dawarich docker/docker-compose.yml:
#   - dawarich_redis DROPPED; reuse existing Dragonfly on external `probata` network, logical DB 3
#   - own PostGIS DB kept (postgis:17-3.5-alpine); owner creds; POSTGRES_DB=dawarich
#   - bind mounts under /data/dawarich (no named volumes)
#   - app published on the tailnet IP only (100.91.190.107:3000)
# Secrets (POSTGRES_PASSWORD, DATABASE_PASSWORD, SECRET_KEY_BASE) supplied via the Coolify env store,
# NOT stored in this file (git-tracked). Byline: Claude Code · Opus 4.8 · 2026-09-25

networks:
  dawarich:
  probata:
    external: true

services:
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    shm_size: 1G
    container_name: dawarich_db
    volumes:
      - /data/dawarich/db_data:/var/lib/postgresql/data
      - /data/dawarich/shared:/var/shared
    networks:
      - dawarich
    environment:
      POSTGRES_USER: msalem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dawarich
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U msalem -d dawarich" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_app:
    image: freikin/dawarich:latest
    container_name: dawarich_app
    volumes:
      - /data/dawarich/public:/var/app/public
      - /data/dawarich/watched:/var/app/tmp/imports/watched
      - /data/dawarich/storage:/var/app/storage
      - /data/dawarich/db_data:/dawarich_db_data
    networks:
      - dawarich
      - probata
    ports:
      - "100.91.190.107:3000:3000"
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ['bin/rails', 'server', '-p', '3000', '-b', '::']
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dragonfly:6379/3
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: msalem
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: 100.91.190.107,ovh-files.tilapia-skilift.ts.net,localhost,127.0.0.1,::1
      TIME_ZONE: America/Detroit
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      WEB_CONCURRENCY: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 4G

  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich_sidekiq
    volumes:
      - /data/dawarich/public:/var/app/public
      - /data/dawarich/watched:/var/app/tmp/imports/watched
      - /data/dawarich/storage:/var/app/storage
    networks:
      - dawarich
      - probata
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: ['sidekiq']
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dragonfly:6379/3
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: msalem
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: 100.91.190.107,ovh-files.tilapia-skilift.ts.net,localhost,127.0.0.1,::1
      BACKGROUND_PROCESSING_CONCURRENCY: "3"
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f sidekiq" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true
