# pgAdmin 4: PostgreSQL management surface for the owner (tailnet only).
# Byline: Claude Code · Opus 5.5 · 2026-09-23. Owner order 08:17: "pgs admin surface is also
# handrolled ... there's lots of good management surfaces for pg"; 08:21 "all 3 for now"
# (pgAdmin, DbGate and CloudBeaver side by side).
#
# Access rule (owner 2026-09-23 08:06): on the tailnet, Tailscale is the only barrier. So pgAdmin
# runs in desktop mode (no pgAdmin login), and the two servers are preloaded server-side:
#   /data/probata/config/pgadmin/servers.json   (probata-db :5432, casebible :5475)
#   /data/probata/secrets/pgadmin/pgpass        (0600, uid 5050; built on the host from each PG
#                                                container's own env by /data/probata/tools/prep_db_surfaces.py)
# servers.json loads only on first start (empty /var/lib/pgadmin). The port binds to the tailnet IP
# only. HTTPS name: svc:pgadmin → https://pgadmin.tilapia-skilift.ts.net
services:
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "100.91.190.107:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: msalem@mitechconsult.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - /data/probata/config/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - /data/probata/secrets/pgadmin/pgpass:/pgpass:ro
      - /data/probata/secrets/pgadmin/default_password:/run/secrets/pgadmin_default_password:ro
      - /data/probata/volumes/pgadmin:/var/lib/pgadmin
